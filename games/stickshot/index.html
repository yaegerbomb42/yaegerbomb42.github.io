<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>StickShot</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;overflow:hidden;background:#0d0f18;font-family:'Outfit','Segoe UI',sans-serif;color:#eee}
    #game-canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
    /* HUD overlay */
    #hud{position:fixed;top:0;left:0;right:0;z-index:10;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-start;padding:14px 16px;gap:8px}
    #hud-left{display:flex;flex-direction:column;gap:6px}
    #hud-hearts{display:flex;gap:6px;align-items:center}
    .heart{width:11px;height:11px;background:#f3f0e8;transform:rotate(45deg);border-radius:1px;transition:background .1s}
    .heart.empty{background:#2a2d36}
    .heart.armor{background:transparent;border:1px solid #a0c4d8;box-shadow:inset 0 0 4px #a0c4d830}
    #hud-score{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;color:#f3f0e8;tabular-nums}
    #hud-mission{font-size:.65rem;font-weight:600;text-transform:uppercase;letter-spacing:.18em;color:#777;margin-top:2px}
    #hud-right{display:flex;gap:8px;pointer-events:auto}
    .hud-btn{width:40px;height:40px;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#ccc;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
    .hud-btn:hover{background:rgba(255,255,255,.12)}
    /* Coop panel */
    #coop-panel{position:fixed;bottom:16px;right:16px;z-index:30;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
    #coop-btn{padding:8px 14px;border-radius:20px;background:rgba(0,220,255,.15);border:1px solid rgba(0,220,255,.35);color:#00dcff;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.15em;cursor:pointer;pointer-events:auto;transition:all .2s}
    #coop-btn:hover{background:rgba(0,220,255,.25);box-shadow:0 0 20px rgba(0,220,255,.3)}
    #coop-status{font-size:.65rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:5px 10px;border-radius:10px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.1)}
    #coop-status.searching{color:#fbbf24;border-color:#fbbf2440;animation:pulse 1.5s ease-in-out infinite}
    #coop-status.connected{color:#34d399;border-color:#34d39940}
    #coop-status.p2{color:#a78bfa;border-color:#a78bfa40}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
    /* Mobile touch bar */
    #touch-bar{position:fixed;inset-x:0;bottom:0;z-index:20;display:none;align-items:flex-end;justify-content:space-between;gap:8px;padding:10px 14px 20px;pointer-events:none}
    @media(pointer:coarse),(max-width:720px){#touch-bar{display:flex}}
    .touch-grp{display:flex;gap:8px;pointer-events:auto}
    .touch-btn{min-width:56px;height:52px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#ddd;font-size:.8rem;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:none;user-select:none;-webkit-tap-highlight-color:transparent;padding:0 10px}
    .touch-btn.fire{background:rgba(244,95,80,.25);border-color:rgba(244,95,80,.5);color:#f45f50}
    /* Game mode overlay (title / paused / dead / won) */
    #overlay{position:fixed;inset:0;z-index:25;display:flex;align-items:center;justify-content:center;background:rgba(13,15,24,.75);backdrop-filter:blur(4px)}
    #overlay.hidden{display:none}
    #overlay-card{background:#12141f;border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:32px;max-width:420px;width:90%;display:flex;flex-direction:column;gap:20px}
    #overlay-kicker{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.25em;color:#666}
    #overlay-title{font-size:2.4rem;font-weight:900;letter-spacing:-.03em;line-height:1.1;color:#f3f0e8}
    #overlay-body{font-size:.875rem;line-height:1.6;color:#888}
    #overlay-stars{display:flex;gap:6px}
    .ostar{width:20px;height:20px;color:#2a2d36;font-size:1.1rem}
    .ostar.lit{color:#f3c760}
    #overlay-rows{display:flex;flex-direction:column;gap:6px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:12px}
    .orow{display:flex;justify-content:space-between;align-items:center;font-size:.75rem;color:#888}
    .orow .ok{color:#7acf94;font-weight:700}
    .orow .miss{color:#555;font-weight:700}
    #overlay-btns{display:flex;flex-direction:column;gap:8px}
    .overlay-btn{height:48px;border-radius:10px;font-size:.875rem;font-weight:700;cursor:pointer;border:none;transition:filter .15s,transform .1s;display:flex;align-items:center;justify-content:center;gap:8px}
    .overlay-btn:active{transform:scale(.97)}
    .overlay-btn.primary{background:#f3f0e8;color:#12141f}
    .overlay-btn.primary:hover{filter:brightness(1.1)}
    .overlay-btn.secondary{background:rgba(255,255,255,.06);color:#ccc;border:1px solid rgba(255,255,255,.12)}
    .overlay-btn.secondary:hover{background:rgba(255,255,255,.1)}
    /* Controls mini-list */
    #controls-list{display:flex;flex-direction:column;gap:6px}
    .ctrl-row{display:flex;gap:10px;font-size:.8rem;color:#666}
    .ctrl-row span:first-child{color:#eee;font-weight:600;min-width:70px}
  </style>
  <script type="module" crossorigin src="./assets/index-D4qUMjZ6.js"></script>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <!-- In-game HUD -->
  <div id="hud">
    <div id="hud-left">
      <div id="hud-hearts"></div>
      <div id="hud-score">0</div>
      <div id="hud-mission"></div>
    </div>
    <div id="hud-right">
      <button class="hud-btn" id="btn-mute" title="Toggle mute">🔊</button>
      <button class="hud-btn" id="btn-pause" title="Pause">⏸</button>
    </div>
  </div>

  <!-- Co-op panel -->
  <div id="coop-panel">
    <div id="coop-status" style="display:none"></div>
    <button id="coop-btn">⚡ Find Co-Op Partner</button>
  </div>

  <!-- Mobile touch controls -->
  <div id="touch-bar">
    <div class="touch-grp">
      <button class="touch-btn" id="tb-left">A</button>
      <button class="touch-btn" id="tb-right">D</button>
    </div>
    <div class="touch-grp">
      <button class="touch-btn" id="tb-dash">Dash</button>
      <button class="touch-btn" id="tb-jump">Jump</button>
      <button class="touch-btn fire" id="tb-fire">Fire</button>
    </div>
  </div>

  <!-- Game mode overlay -->
  <div id="overlay">
    <div id="overlay-card">
      <div id="overlay-kicker"></div>
      <div id="overlay-title"></div>
      <div id="overlay-stars" style="display:none"></div>
      <div id="overlay-rows" style="display:none"></div>
      <div id="overlay-body"></div>
      <div id="overlay-btns"></div>
    </div>
  </div>

</body>
</html>
