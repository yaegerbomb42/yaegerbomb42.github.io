<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Autonomous Souls: AI Physics Room</title>
    <style>
        :root {
            --bubble-bg: rgba(15, 23, 42, 0.65);
            --pill-bg: rgba(15, 23, 42, 0.85);
            --input-text: #f8fafc;
            --accent: rgba(56, 189, 248, 0.5);
            --glass-border: rgba(255, 255, 255, 0.15);
            --liquid-blur: blur(24px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #7dd3fc;
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .speech-bubble {
            position: absolute;
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.8) 0%, rgba(15, 23, 42, 0.6) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 12px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-top: 1.5px solid rgba(255, 255, 255, 0.4);
            max-width: 250px;
            font-size: 14px;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            z-index: 100;
            transform: translate(-50%, -120%) scale(0.85);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
            color: #ffffff;
            line-height: 1.4;
        }

        .thought-bubble {
            position: absolute;
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.65) 0%, rgba(15, 23, 42, 0.45) 100%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #e2e8f0;
            padding: 8px 16px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            font-size: 12px;
            font-style: italic;
            opacity: 0;
            pointer-events: none;
            z-index: 90;
            transform: translate(-50%, -150%);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
            max-width: 220px;
        }

        .speech-bubble.shout {
            transform: translate(-50%, -120%) scale(1.1);
            animation: shout-shake 0.08s infinite;
            background: linear-gradient(180deg, rgba(225, 29, 72, 0.95) 0%, rgba(159, 18, 57, 0.8) 100%);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 25px rgba(225, 29, 72, 0.5);
        }

        .speech-bubble.whisper {
            opacity: 0.55 !important;
            transform: translate(-50%, -120%) scale(0.9);
            filter: blur(0.3px);
        }

        .speech-bubble.electronic {
            font-family: 'Courier New', monospace;
            color: #22c55e;
            border-color: #22c55e;
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.4);
        }

        @keyframes shout-shake {
            0% { transform: translate(-51%, -121%) scale(1.1); }
            100% { transform: translate(-49%, -119%) scale(1.12); }
        }

        .vocal-viz {
            position: absolute;
            pointer-events: none;
            z-index: 95;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: translate(-50%, -50%);
            transition: opacity 0.2s;
        }

        .vocal-viz.active {
            opacity: 1;
        }

        .viz-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        .vocal-viz.active .viz-inner {
            animation: pulse-viz 0.15s infinite alternate ease-in-out;
        }

        .viz-wave {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0);
            pointer-events: none;
        }

        .vocal-viz.active .viz-wave {
            animation: wave-out 0.4s infinite linear;
        }

        @keyframes pulse-viz {
            0% { transform: scale(0.85); border-color: rgba(255,255,255,0.25); }
            100% { transform: scale(1.3); border-color: rgba(255,255,255,0.7); }
        }

        @keyframes wave-out {
            0% { transform: scale(1); border-color: rgba(255, 255, 255, 0.4); opacity: 1; }
            100% { transform: scale(2.8); border-color: rgba(255, 255, 255, 0); opacity: 0; }
        }

        #controls-container {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 0 20px;
            pointer-events: none;
            z-index: 1000;
        }

        #spawn-hand-btn {
            pointer-events: auto;
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.75) 0%, rgba(15, 23, 42, 0.5) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-top: 1.5px solid rgba(255, 255, 255, 0.4);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            transition: all 0.2s;
        }

        #spawn-hand-btn:active {
            transform: scale(0.92);
        }

        .input-pill {
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.8) 0%, rgba(15, 23, 42, 0.6) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-top: 1.5px solid rgba(255, 255, 255, 0.4);
            border-radius: 100px;
            padding: 0 8px 0 22px;
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 480px;
            height: 50px;
            pointer-events: auto;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
            position: relative;
            transition: all 0.3s;
            overflow: hidden;
        }

        .input-pill.processing {
            max-width: 80px;
            padding-left: 0;
            padding-right: 0;
            justify-content: center;
        }

        .input-pill.processing #user-input,
        .input-pill.processing #send-btn {
            display: none;
        }

        .loader-dots {
            display: none;
            gap: 4px;
            color: var(--input-text);
            font-size: 32px;
            line-height: 0;
            margin-bottom: 14px;
            user-select: none;
        }

        .input-pill.processing .loader-dots {
            display: flex;
        }

        .loader-dots span {
            animation: dotFade 1.4s infinite ease-in-out both;
        }

        .loader-dots span:nth-child(1) { animation-delay: -0.32s; }
        .loader-dots span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes dotFade {
            0%, 80%, 100% { opacity: 0.15; }
            40% { opacity: 1; }
        }

        #user-input {
            background: transparent;
            border: none;
            color: var(--input-text);
            flex: 1;
            font-size: 14px;
            outline: none;
            padding: 6px 0;
        }

        #send-btn {
            background: transparent;
            color: rgba(255, 255, 255, 0.9);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 8px;
            transition: all 0.2s;
            opacity: 0.7;
        }

        #send-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.1);
            opacity: 1;
        }

        #director-status {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 100px;
            padding: 6px 20px;
            font-size: 13px;
            font-weight: 600;
            color: #00f3ff;
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.4);
            pointer-events: none;
            z-index: 100;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 5px 15px rgba(0,0,0,0.25);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 8px #22c55e;
        }

        .status-dot.thinking {
            background: #e11d48;
            box-shadow: 0 0 8px #e11d48;
            animation: pulse-dot 1s infinite alternate;
        }

        @keyframes pulse-dot {
            0% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .lobby-overlay {
            position: absolute;
            inset: 0;
            background: rgba(13, 15, 30, 0.9);
            backdrop-filter: blur(15px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 5000;
            padding: 20px;
        }

        .lobby-card {
            background: rgba(30, 41, 59, 0.7);
            border: 2px solid rgba(56, 189, 248, 0.4);
            border-radius: 24px;
            padding: 35px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .lobby-input {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: #fff;
            padding: 14px;
            margin-bottom: 16px;
            outline: none;
            font-size: 1.1rem;
            text-align: center;
            font-family: inherit;
        }

        .lobby-input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
        }

        .lobby-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(to right, #38bdf8, #bd13fe);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 10px;
        }

        .lobby-btn:hover {
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
            transform: translateY(-2px);
        }

        .room-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 700;
            color: #bd13fe;
            text-shadow: 0 0 8px rgba(189, 19, 254, 0.4);
            z-index: 100;
            letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.25);
        }

        .auto-drop-toggle {
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 16px;
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-top: 1.5px solid rgba(255, 255, 255, 0.4);
            border-radius: 100px;
            height: 50px;
            cursor: pointer;
            user-select: none;
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            transition: all 0.2s;
        }

        .auto-drop-toggle:active {
            transform: scale(0.95);
        }

        .auto-drop-toggle.active {
            border-color: #22c55e;
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.3);
        }

        .auto-drop-toggle .toggle-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef4444;
            box-shadow: 0 0 6px #ef4444;
            transition: all 0.2s;
        }

        .auto-drop-toggle.active .toggle-dot {
            background: #22c55e;
            box-shadow: 0 0 8px #22c55e;
        }

        @media (max-width: 600px) {
            .speech-bubble {
                max-width: 170px;
                font-size: 12px;
            }
            #controls-container {
                bottom: 15px;
            }
        }
    </style>
</head>
<body>
    <div id="lobby-overlay" class="lobby-overlay">
        <div class="lobby-card">
            <h2 style="font-size: 1.8rem; font-weight: 900; margin-bottom: 20px; color: #38bdf8; letter-spacing: 2px;">MULTIPLAYER LOBBY</h2>
            <input type="text" id="player-name-input" class="lobby-input" placeholder="YOUR NAME" maxlength="10" />
            <div style="display: flex; gap: 10px; margin-bottom: 16px;">
                <button id="create-room-btn" class="lobby-btn" style="margin-bottom: 0; background: linear-gradient(to right, #38bdf8, #bd13fe);">CREATE ROOM</button>
                <button id="solo-sandbox-btn" class="lobby-btn" style="margin-bottom: 0; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.15);">SOLO PLAY</button>
            </div>
            <div style="border-top: 1px solid rgba(255,255,255,0.15); padding-top: 16px;">
                <input type="text" id="room-code-input" class="lobby-input" placeholder="ROOM CODE TO JOIN" maxlength="4" style="text-transform: uppercase;" />
                <button id="connect-room-btn" class="lobby-btn" style="margin-bottom: 0; background: linear-gradient(to right, #bd13fe, #38bdf8);">JOIN EXISTING ROOM</button>
            </div>
        </div>
    </div>

    <div id="game-container">
        <div id="room-badge" class="room-badge" style="display: none;">SOLO RUN</div>
        <div id="location-banner" style="position: absolute; top: 12%; left: 50%; transform: translate(-50%, -50%) scale(0.9); background: rgba(15, 23, 42, 0.85); border: 1.5px solid rgba(56, 189, 248, 0.35); border-radius: 8px; padding: 12px 28px; color: #fff; font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; pointer-events: none; opacity: 0; transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
            LOCATION NAME
        </div>
        <div id="director-status">
            <div class="status-dot" id="status-dot"></div>
            <span id="status-text">ARCADE DIRECTOR ACTIVE</span>
        </div>

        <canvas id="canvas"></canvas>
        <div class="speech-bubble" id="bubble-Alex" style="display: none;"></div>
        <div class="speech-bubble" id="bubble-Sam" style="display: none;"></div>
        <div id="vocal-viz-Alex" class="vocal-viz">
            <div class="viz-inner"></div>
            <div class="viz-wave"></div>
        </div>
        <div id="vocal-viz-Sam" class="vocal-viz">
            <div class="viz-inner"></div>
            <div class="viz-wave"></div>
        </div>
        <div class="thought-bubble" id="thought-Alex" style="display: none;"></div>
        <div class="thought-bubble" id="thought-Sam" style="display: none;"></div>
        
        <div id="controls-container">
            <div class="input-pill" id="input-pill">
                <div class="loader-dots">
                    <span>.</span><span>.</span><span>.</span>
                </div>
                <input type="text" id="user-input" placeholder="Give orders (e.g. 'Alex, throw a box at Sam')..." autocomplete="off">
                <button id="send-btn">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="19" x2="12" y2="5"></line>
                        <polyline points="5 12 12 5 19 12"></polyline>
                    </svg>
                </button>
            </div>
            <button id="spawn-hand-btn" title="Drop Random Object">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="12" y1="8" x2="12" y2="16"></line>
                    <line x1="8" y1="12" x2="16" y2="12"></line>
                </svg>
            </button>
            <div id="auto-drop-toggle" class="auto-drop-toggle" title="Toggle Auto Drop (every 3 seconds)">
                <div class="toggle-dot"></div>
                <span>AUTO DROP</span>
            </div>
        </div>
    </div>

    <script type="module">
        import Matter from 'https://esm.sh/matter-js@0.19.0';

        const { Engine, Render, Runner, Bodies, Composite, Constraint, Vector, Body, Events, Query, Mouse, MouseConstraint } = Matter;

        const canvas = document.getElementById('canvas');
        const UI = {
            bubbles: {
                Alex: document.getElementById('bubble-Alex'),
                Sam: document.getElementById('bubble-Sam')
            },
            thoughts: {
                Alex: document.getElementById('thought-Alex'),
                Sam: document.getElementById('thought-Sam')
            },
            vocalViz: {
                Alex: document.getElementById('vocal-viz-Alex'),
                Sam: document.getElementById('vocal-viz-Sam')
            },
            statusDot: document.getElementById('status-dot'),
            statusText: document.getElementById('status-text')
        };

        // WebAudio Formant Synthesizer
        let audioCtx = null;
        async function getAudioCtx() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') {
                await audioCtx.resume().catch(() => {});
            }
            return audioCtx;
        }

        window.addEventListener('mousedown', () => getAudioCtx(), { once: true });
        window.addEventListener('touchstart', () => getAudioCtx(), { once: true });

        const FORMANTS = {
            'a': [720, 1240, 2800],
            'e': [420, 1850, 2900],
            'i': [310, 2200, 3000],
            'o': [460, 880, 2700],
            'u': [340, 720, 2600],
            'default': [500, 1500, 2500]
        };

        async function playToneSequence(tones) {
            if (!tones || !Array.isArray(tones)) return;
            const ctx = await getAudioCtx();
            const now = ctx.currentTime;
            let time = now;
            for (const t of tones) {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = t.type || 'sine';
                osc.frequency.setValueAtTime(t.freq || 440, time);
                gain.gain.setValueAtTime(t.gain !== undefined ? t.gain : 0.15, time);
                gain.gain.exponentialRampToValueAtTime(0.001, time + (t.duration || 0.1));
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(time);
                osc.stop(time + (t.duration || 0.1));
                time += (t.duration || 0.1) + (t.delay || 0.05);
            }
            await new Promise(r => setTimeout(r, (time - now) * 1000));
        }

        async function playProceduralVocal(char, text, mode, params = {}) {
            const ctx = await getAudioCtx();
            const isAlex = char.name === 'Alex';
            
            const configData = {
                baseFreq: params.pitch || (isAlex ? 95 : 225),
                vibratoFreq: params.vibrato_freq || 6,
                vibratoDepth: params.vibrato_depth || (isAlex ? 5 : 9),
                speed: params.speed || (mode === 'shout' ? 0.07 : (mode === 'whisper' ? 0.16 : 0.11)),
                gain: params.gain || (mode === 'shout' ? 0.35 : (mode === 'whisper' ? 0.05 : 0.2))
            };

            const viz = UI.vocalViz[char.name];
            if (viz) viz.classList.add('active');

            const tokens = text.toLowerCase().split('');

            for (let i = 0; i < tokens.length; i++) {
                const charCode = tokens[i];
                if (charCode === ' ') {
                    await new Promise(r => setTimeout(r, 65));
                    continue;
                }

                const now = ctx.currentTime;
                const duration = configData.speed * (0.7 + Math.random() * 0.5);
                
                const source = ctx.createOscillator();
                const sourceGain = ctx.createGain();
                source.type = mode === 'whisper' ? 'sine' : 'sawtooth';
                
                let freq = configData.baseFreq;
                if (text.includes('?')) freq *= (1 + (i / tokens.length) * 0.3);
                if (text.includes('!')) freq *= 1.15;
                
                source.frequency.setValueAtTime(freq, now);
                
                const vibrato = ctx.createOscillator();
                const vibratoGain = ctx.createGain();
                vibrato.frequency.value = configData.vibratoFreq;
                vibratoGain.gain.value = configData.vibratoDepth;
                vibrato.connect(vibratoGain);
                vibratoGain.connect(source.frequency);

                const formants = FORMANTS[charCode] || FORMANTS['default'];
                const filterGroup = ctx.createGain();
                
                formants.forEach(f => {
                    const filter = ctx.createBiquadFilter();
                    filter.type = 'bandpass';
                    filter.frequency.value = f;
                    filter.Q.value = 12;
                    source.connect(filter);
                    filter.connect(filterGroup);
                });

                if (['s','t','k','f','h','x'].includes(charCode)) {
                    const noise = ctx.createBufferSource();
                    const bufferSize = ctx.sampleRate * duration;
                    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let j = 0; j < bufferSize; j++) data[j] = Math.random() * 2 - 1;
                    noise.buffer = buffer;

                    const noiseFilter = ctx.createBiquadFilter();
                    noiseFilter.type = 'highpass';
                    noiseFilter.frequency.value = 4500;
                    
                    const noiseGain = ctx.createGain();
                    noiseGain.gain.value = configData.gain * 0.4;
                    
                    noise.connect(noiseFilter);
                    noiseFilter.connect(noiseGain);
                    noiseGain.connect(ctx.destination);
                    noise.start(now);
                    noise.stop(now + duration);
                }

                sourceGain.gain.setValueAtTime(0, now);
                sourceGain.gain.linearRampToValueAtTime(configData.gain, now + 0.02);
                sourceGain.gain.exponentialRampToValueAtTime(0.001, now + duration);

                filterGroup.connect(sourceGain);
                sourceGain.connect(ctx.destination);

                source.start(now);
                source.stop(now + duration);
                vibrato.start(now); 
                vibrato.stop(now + duration);

                await new Promise(r => setTimeout(r, duration * 850));
            }
            
            if (viz) viz.classList.remove('active');
        }

        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const inputPill = document.getElementById('input-pill');
        const spawnHandBtn = document.getElementById('spawn-hand-btn');
        const autoDropToggle = document.getElementById('auto-drop-toggle');
        const lobbyOverlay = document.getElementById('lobby-overlay');
        const playerNameInput = document.getElementById('player-name-input');
        const roomCodeInput = document.getElementById('room-code-input');

            let spawned = 0;
            for (let i = 0; i < PARTICLE_POOL_SIZE; i++) {
                const p = particlePool[i];
                if (!p.active) {
                    p.x = x;
                    p.y = y;
                    p.vx = (Math.random() - 0.5) * 4.5;
                    p.vy = (Math.random() - 0.5) * 4.5 - 1.8;
                    p.life = 1.0;
                    p.decay = Math.random() * 0.045 + 0.02;
                    p.size = Math.random() * 3 + 1.8;
                    p.color = color;
                    p.active = true;
                    spawned++;
                    if (spawned >= count) break;
                }
            }

        function procedurallyGenerateScreen(screenIndex) {
            // Clip screens outside -5 to 5 boundary
            const clampedIndex = Math.max(-5, Math.min(5, screenIndex));
            const sKey = String(clampedIndex);
            
            if (screenComposites[sKey]) return screenComposites[sKey];

            const comp = Composite.create();
            const startX = clampedIndex * config.width;
            const w = config.width;

            const def = LEVEL_DEFS[sKey] || LEVEL_DEFS['0'];
            comp.theme = def.theme;
            def.build(comp, startX, w);

            screenComposites[sKey] = comp;
            return comp;
        }

        // Character Scaling Helper (Fat/Skinny)
        function scaleCharacter(char, factor) {
            const parts = [
                char.head, char.torso,
                char.legL.thigh, char.legL.calf, char.legL.foot,
                char.legR.thigh, char.legR.calf, char.legR.foot,
                char.armL.upper, char.armL.lower, char.armL.hand,
                char.armR.upper, char.armR.lower, char.armR.hand
            ];
            parts.forEach(p => {
                if (p) Body.scale(p, factor, factor);
            });
            char.composite.constraints.forEach(c => {
                c.length *= factor;
                c.pointA.x *= factor;
                c.pointA.y *= factor;
                c.pointB.x *= factor;
                c.pointB.y *= factor;
            });
        }

        // Gun Shooting Logic
        async function playGunshotSound() {
            const ctx = await getAudioCtx();
            const now = ctx.currentTime;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(320, now);
            osc.frequency.exponentialRampToValueAtTime(10, now + 0.14);
            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.14);
        }

        // TNT Explosion Solver
        async function playExplosionSound() {
            const ctx = await getAudioCtx();
            const now = ctx.currentTime;
            const bufferSize = ctx.sampleRate * 0.35;
            const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            const noise = ctx.createBufferSource();
            noise.buffer = buffer;
            const filter = ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 240;
            const gain = ctx.createGain();
            gain.gain.setValueAtTime(0.55, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(ctx.destination);
            noise.start(now);
            noise.stop(now + 0.35);
        }

        function explodeTNT(tntBody) {
            if (tntBody.exploded) return;
            tntBody.exploded = true;
            const pos = tntBody.position;
            Composite.allBodies(world).forEach(b => {
                if (b === tntBody || b.isStatic) return;
                const d = Math.hypot(b.position.x - pos.x, b.position.y - pos.y);
                if (d < 240) {
                    const forceMag = (240 - d) * 0.0006 * (b.density / 0.008);
                    const angle = Math.atan2(b.position.y - pos.y, b.position.x - pos.x);
                    Body.applyForce(b, b.position, {
                        x: Math.cos(angle) * forceMag,
                        y: Math.sin(angle) * forceMag - 0.0015
                    });
                }
            });

            // Explosion damage to nearby characters
            characters.forEach(char => {
                const dist = Math.hypot(char.torso.position.x - pos.x, char.torso.position.y - pos.y);
                if (dist < 185) {
                    const dmg = Math.round((1 - dist / 185) * 55);
                    if (dmg > 5) {
                        damageCharacter(char, dmg);
                    }
                }
            });

            playExplosionSound();
            for (let i = 0; i < 12; i++) {
                const p = Bodies.circle(pos.x, pos.y, 4 + Math.random() * 4, {
                    density: 0.001,
                    frictionAir: 0.06,
                    render: { fillStyle: '#ef4444' }
                });
                Composite.add(world, p);
                Body.setVelocity(p, {
                    x: (Math.random() - 0.5) * 11,
                    y: (Math.random() - 0.5) * 11
                });
                setTimeout(() => Composite.remove(world, p), 800 + Math.random() * 800);
            }
            Composite.remove(world, tntBody);
        }

        Events.on(engine, 'collisionStart', (event) => {
            event.pairs.forEach(pair => {
                const checkExplode = (body, other) => {
                    if (body.label === 'tnt' && !body.exploded) {
                        const speed = Math.hypot(body.velocity.x - other.velocity.x, body.velocity.y - other.velocity.y);
                        if (speed > 4.5) explodeTNT(body);
                    }
                };
                checkExplode(pair.bodyA, pair.bodyB);
                checkExplode(pair.bodyB, pair.bodyA);

                // Trampoline bounce effects
                if (pair.bodyA.label === 'trampoline' || pair.bodyB.label === 'trampoline') {
                    const other = pair.bodyA.label === 'trampoline' ? pair.bodyB : pair.bodyA;
                    emitParticles(other.position.x, other.position.y, '#ef4444', 12);
                    playToneSequence([
                        { note: 'D4', duration: '16n' },
                        { note: 'G4', duration: '8n' }
                    ]);

                // Reset jumpCount on ground/platform contact (Task 18 correction)
                const checkFallDamageAndResetJumps = (bodyA, bodyB) => {
                    characters.forEach(char => {
                        const isPart = (char.torso === bodyA || char.head === bodyA || char.legL.foot === bodyA || char.legR.foot === bodyA || char.legL.calf === bodyA || char.legR.calf === bodyA);

                                char.jumpCount = 0;
                            }
                        }
                    });
                };
                checkFallDamageAndResetJumps(pair.bodyA, pair.bodyB);
                checkFallDamageAndResetJumps(pair.bodyB, pair.bodyA);

                // Task 5 & Task 21: Bullet Deflection / Crate Fracturing / Damage check
                if (pair.bodyA.label === 'bullet' || pair.bodyB.label === 'bullet') {
                    const bullet = pair.bodyA.label === 'bullet' ? pair.bodyA : pair.bodyB;
                    const other = pair.bodyA.label === 'bullet' ? pair.bodyB : pair.bodyA;
                    
                    if (other.label === 'sword') {
                        const holder = characters.find(c => c.grabConstraint && c.grabConstraint.bodyB === other);

                    } else if (other.label === 'crate') {
                        const pos = other.position;
                        const w = 22;
                        const h = 22;
                        const parts = [];
                        for (let dx = -1; dx <= 1; dx += 2) {
                            for (let dy = -1; dy <= 1; dy += 2) {
                                const db = Bodies.rectangle(pos.x + dx*11, pos.y + dy*11, w, h, {
                                    friction: 0.2,
                                    restitution: 0.35,
                                    render: { fillStyle: '#b45309', strokeStyle: '#78350f', lineWidth: 1 }
                                });
                                Body.setVelocity(db, {
                                    x: bullet.velocity.x * 0.15 + (Math.random() - 0.5) * 3,
                                    y: -2 + (Math.random() - 0.5) * 3
                                });
                                parts.push(db);
                            }
                        }
                        Composite.add(world, parts);
                        setTimeout(() => {
                            parts.forEach(db => Composite.remove(world, db));
                        }, 1200);

                        setTimeout(() => {
                            Composite.remove(world, other);
                            Composite.remove(world, bullet);
                        }, 0);

                        playToneSequence([{ note: 'D3', duration: '16n' }]);
                        emitParticles(pos.x, pos.y, '#d97706', 15);
                        screenshake = 5;
                    } else {
                        characters.forEach(char => {
                            const isPart = (char.torso === other || char.head === other || char.legL.foot === other || char.legR.foot === other);
                            if (isPart && !char.isFainted) {
                                damageCharacter(char, 18);
                                speak(char, { text: "Ah! Shot!", mode: 'shout' });
                                setTimeout(() => {
                                    Composite.remove(world, bullet);
                                }, 0);
                            }
                        });
                    }
                }

                // Task 22: Potion Absorption Check
                if (pair.bodyA.label === 'potion' || pair.bodyB.label === 'potion') {
                    const potion = pair.bodyA.label === 'potion' ? pair.bodyA : pair.bodyB;
                    const other = pair.bodyA.label === 'potion' ? pair.bodyB : pair.bodyA;
                    
                    characters.forEach(char => {
                        const isPart = (char.torso === other || char.head === other || char.legL.foot === other || char.legR.foot === other);
                        if (isPart && !char.isFainted && char.hp < 100) {
                            char.hp = Math.min(100, char.hp + 35);
                            char.stats.potionsDrunk += 1;
                            emitTextOverlay(char.torso.position.x, char.torso.position.y - 30, '+35 HP', '#10b981');
                            emitParticles(potion.position.x, potion.position.y, '#10b981', 12);
                             playToneSequence([
                                { note: 'G4', duration: '16n' },
                                { note: 'C5', duration: '8n' }
                            ]);
                            setTimeout(() => {
                                Composite.remove(world, potion);
                            }, 0);
                        }
                    });
                }

                // Task 15: Thrown physical impact check
                const checkThrowImpact = (body, other) => {
                    if (body.thrownBy && Date.now() - body.throwTime < 1800) {
                        characters.forEach(char => {
                            if (char === body.thrownBy || char.isFainted) return;
                            const isPart = (char.torso === other || char.head === other || char.legL.foot === other || char.legR.foot === other);
                            if (isPart) {
                                const speed = Math.hypot(body.velocity.x, body.velocity.y);
                                const dmg = Math.round(speed * 2.8 * (body.mass / 0.008));
                                if (dmg > 5) {
                                    damageCharacter(char, dmg);
                                    speak(char, { text: "Oof! Caught a flying block!", mode: 'shout' });
                                    body.thrownBy = null;
                                    screenshake = 10;
                                }
                            }
                        });
                    }
                };
                checkThrowImpact(pair.bodyA, pair.bodyB);
                checkThrowImpact(pair.bodyB, pair.bodyA);
            });
        });

- Interactions: They can talk, play, run, argue, throw crates at each other, point, or wave.

ACTION OPTIONS:
- WALK_LEFT: Walk leftward.
- WALK_RIGHT: Walk rightward.
- WALK_TO_TABLE: Go to the center table.
- JUMP: Jump in the air.
- WAVE: Wave arms.
- FLEX: Flex muscles.
- GRAB: Grab a nearby dynamic object.
- RELEASE: Drop the grabbed object.
- THROW: Throw the grabbed object dynamically.
- IDLE: Stand still.

OUTPUT FORMAT (JSON ONLY):
{
  "scene_title": "Descriptive title of the scene",
  "alex_timeline": [
    { "time": 0, "action": "WALK_TO_TABLE", "text": "Let us check out this golden crate.", "mode": "speech" },
    { "time": 12, "action": "GRAB", "text": "I have lifted the block.", "mode": "speech" },
    { "time": 30, "action": "RELEASE", "text": "Take it, Sam.", "mode": "speech" }
  ],
  "sam_timeline": [
    { "time": 2, "action": "WALK_TO_TABLE", "text": "Woohoo! A box!", "mode": "speech" },
    { "time": 15, "action": "JUMP", "text": "Yes! Look at me jump!", "mode": "speech" },
    { "time": 33, "action": "GRAB", "text": "Mine now!", "mode": "speech" }
  ]
}`;

        function getVisionData() {
            const allBodies = Composite.allBodies(world);
            const blocks = allBodies.filter(b => b.label === 'crate');
            
            return {
                alex: { x: Math.round(alex.torso.position.x), y: Math.round(alex.torso.position.y) },
                sam: { x: Math.round(sam.torso.position.x), y: Math.round(sam.torso.position.y) },
                crates: blocks.map(b => ({ x: Math.round(b.position.x), y: Math.round(b.position.y) }))
            };
        }

        // Orchestrator Dispatcher (Runs once per minute)
        async function fetchNewScene() {
            if (isOrchestratorThinking || isUserCommandActive) return;
            
            // Only query if tab is active/focused (watched by someone)
            if (!document.hasFocus()) {
                console.log("[Arcade Director] Idle: browser not active.");
                return;
            }

            isOrchestratorThinking = true;
            UI.statusDot.className = 'status-dot thinking';
            UI.statusText.innerText = "DIRECTOR DIRECTING SCENE...";

            try {
                const vision = JSON.stringify(getVisionData());
                
                // Proxy to express backend to bypass CORS policy blocks
                const url = '/api/chat/completions';
                const headers = {
                    'Content-Type': 'application/json'
                };
                if (window.VITE_LLM_ENDPOINT) {
                    headers['x-custom-endpoint'] = window.VITE_LLM_ENDPOINT;
                }
                if (window.VITE_LLM_API_KEY) {
                    headers['x-custom-api-key'] = window.VITE_LLM_API_KEY;
                }
                if (window.VITE_LLM_MODEL) {
                    headers['x-custom-model'] = window.VITE_LLM_MODEL;
                }

                const bodyPayload = {
                    messages: [
                        { role: 'system', content: SCENE_SYSTEM_PROMPT },
                        { role: 'user', content: `Direct the next 60-second physics scene. Room States: ${vision}. Make them talk, fight over crates, throw things, or wave.` }
                    ]
                };

                const response = await fetch(url, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify(bodyPayload)
                });

                const data = await response.json();
                const textOutput = data.choices?.[0]?.message?.content;
                if (!textOutput) throw new Error('Empty director response');

                const scenePlan = JSON.parse(textOutput);
                
                // Load timelines
                currentTimeline.Alex = (scenePlan.alex_timeline || []).map(item => ({ ...item, executed: false }));
                currentTimeline.Sam = (scenePlan.sam_timeline || []).map(item => ({ ...item, executed: false }));
                
                sceneStartTime = Date.now();
                sceneActive = true;
                
                console.log(`[Director] New Scene Initiated: "${scenePlan.scene_title || 'Arcade Showcase'}"`);
                UI.statusText.innerText = `Scene: ${scenePlan.scene_title || 'Arcade Showcase'}`;
            } catch (err) {
                console.error("[Director] Error planning scene:", err);
                UI.statusText.innerText = "DIRECTOR RE-CONNECTING";
            } finally {
                isOrchestratorThinking = false;
                UI.statusDot.className = 'status-dot';
            }
        }

        // Setup Scene Interval Loop (Once per minute)
        setInterval(fetchNewScene, 60000);
        setTimeout(fetchNewScene, 2000); // Initial kickoff

        // Timeline Execution Step
        function processSceneTimeline() {
            if (!sceneActive) return;
            const elapsed = (Date.now() - sceneStartTime) / 1000;

            characters.forEach(char => {
                const timeline = currentTimeline[char.name];
                if (!timeline) return;

                timeline.forEach(event => {
                    if (!event.executed && elapsed >= event.time) {
                        event.executed = true;
                        
                        // Execute physical action
                        handleAction(char, event.action);
                        
                        // Output speech bubble & synthesized voice
                        if (event.text) {
                            speak(char, { text: event.text, mode: event.mode || 'speech' });
                        }
                    }
                });
            });

            // Clean up when 60s expires
            if (elapsed >= 60) {
                sceneActive = false;
                UI.statusText.innerText = "ARCADE DIRECTOR ACTIVE";
            }
        }

        const GLOBAL_SYSTEM_PROMPT = `You are the omnipotent AI director and God of a 2D physics ragdoll room.
