        function updateCharacterStyle(char, style) {
            if (!char) return;
            if (style.color) {
                char.colors.shirt = style.color;
                char.torso.render.fillStyle = style.color;
                char.legL.thigh.render.fillStyle = style.color;
                char.legR.thigh.render.fillStyle = style.color;
                char.armL.upper.render.fillStyle = style.color;
                char.armR.upper.render.fillStyle = style.color;
            }
            if (style.glow !== undefined) {
                char.glow = style.glow;
            }
        }

        // Interactive Override Command (Instantly overrides scene timelines)
        async function runInteractiveOverride(command) {
            // Cancel current scenes
            sceneActive = false;
            currentTimeline.Alex = [];
            currentTimeline.Sam = [];

            isUserCommandActive = true;
            inputPill.classList.add('processing');

            characters.forEach(char => {
                const bubble = UI.thoughts[char.name];
                if (bubble) {
                    bubble.innerText = "...thinking...";
                    bubble.style.left = `${char.head.position.x - cameraX}px`;
                    bubble.style.top = `${char.head.position.y - 30}px`;
                    bubble.style.opacity = '0.7';
                    bubble.style.display = 'block';
                }
            });

            try {
                const vision = JSON.stringify(getVisionData());
                
                // Flexible endpoint lookup: support custom Azure OpenAI or Local Ollama endpoints via optional variables
                // Proxy to express backend to bypass CORS policy blocks
                const url = '/api/chat/completions';
                const headers = {
                    'Content-Type': 'application/json'
                };
                if (window.VITE_LLM_ENDPOINT) {
                    headers['x-custom-endpoint'] = window.VITE_LLM_ENDPOINT;
                }
                if (window.VITE_LLM_API_KEY) {
                    headers['x-custom-api-key'] = window.VITE_LLM_API_KEY;
                }
                if (window.VITE_LLM_MODEL) {
                    headers['x-custom-model'] = window.VITE_LLM_MODEL;
                }

                const bodyPayload = {
                    messages: [
                        { role: 'system', content: GLOBAL_SYSTEM_PROMPT },
                        { role: 'user', content: `IMMEDIATE COMMAND: "${command}". Vision States: ${vision}. You MUST execute this now.` }
                    ]
                };

                const response = await fetch(url, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify(bodyPayload)
                });

                const data = await response.json();
                const textOutput = data.choices?.[0]?.message?.content;
                if (!textOutput) throw new Error('Empty response');

                const result = JSON.parse(textOutput);
                characters.forEach(char => {
                    const bubble = UI.thoughts[char.name];
                    if (bubble) bubble.style.opacity = '0';
                });

                // Process Actions (Timelines with automatic fallback to single direct actions)
                let hasTimeline = false;
                if (result.alex_timeline && Array.isArray(result.alex_timeline)) {
                    currentTimeline.Alex = result.alex_timeline.map(item => ({ ...item, executed: false }));
                    hasTimeline = true;
                } else if (result.alex_action) {
                    currentTimeline.Alex = [{ time: 0, action: result.alex_action, executed: false }];
                    hasTimeline = true;
                }

                if (result.sam_timeline && Array.isArray(result.sam_timeline)) {
                    currentTimeline.Sam = result.sam_timeline.map(item => ({ ...item, executed: false }));
                    hasTimeline = true;
                } else if (result.sam_action) {
                    currentTimeline.Sam = [{ time: 0, action: result.sam_action, executed: false }];
                    hasTimeline = true;
                }

                if (hasTimeline) {
                    sceneStartTime = Date.now();
                    sceneActive = true;
                    UI.statusText.innerText = `Command Executed`;
                }

                // Process Physics Modifications
                if (result.physics_modifications) {
                    const mods = result.physics_modifications;
                    if (mods.gravity) {
                        world.gravity.x = mods.gravity.x !== undefined ? mods.gravity.x : world.gravity.x;
                        world.gravity.y = mods.gravity.y !== undefined ? mods.gravity.y : world.gravity.y;
                    }
                    if (mods.timeScale !== undefined) {
                        engine.timing.timeScale = mods.timeScale;
                    }
                    if (mods.scale_character) {
                        const targetChar = mods.scale_character.name === 'Sam' ? sam : alex;
                        scaleCharacter(targetChar, mods.scale_character.factor);
                    }
                    if (mods.spawn_objects && Array.isArray(mods.spawn_objects)) {
                        mods.spawn_objects.forEach(obj => {
                            const spawnX = obj.x !== undefined ? obj.x : (currentScreenX * config.width + config.width / 2);
                            spawnCustomObject(obj.type, spawnX, obj.y || 150);
                        });
                    }
                    if (mods.wind !== undefined) {
                        activeWindX = mods.wind.x !== undefined ? mods.wind.x : activeWindX;
                    }
                    if (mods.explosion) {
                        const exp = mods.explosion;
                        const expX = exp.x !== undefined ? exp.x : (currentScreenX * config.width + config.width / 2);
                        const expY = exp.y !== undefined ? exp.y : 250;
                        const forceVal = exp.force !== undefined ? exp.force : 1.0;
                        Composite.allBodies(world).forEach(b => {
                            if (b.isStatic) return;
                            const dx = b.position.x - expX;
                            const dy = b.position.y - expY;
                            const dist = Math.hypot(dx, dy);
                            if (dist < 400 && dist > 1) {
                                const push = (1 - dist / 400) * forceVal * 0.08;
                                Body.applyForce(b, b.position, { x: (dx / dist) * push, y: (dy / dist) * push });
                            }
                        });
                    }
                    if (mods.bounciness !== undefined) {
                        Composite.allBodies(world).forEach(b => {
                            if (!b.isStatic) b.restitution = mods.bounciness;
                        });
                    }
                    if (mods.friction !== undefined) {
                        Composite.allBodies(world).forEach(b => {
                            if (!b.isStatic) {
                                b.friction = mods.friction;
                                b.frictionAir = mods.friction * 0.05;
                            }
                        });
                    }
                    if (mods.ragdoll_stiffness !== undefined) {
                        const stiffness = mods.ragdoll_stiffness;
                        const sVal = stiffness === 'floppy' ? 0.03 : (stiffness === 'stiff' ? 0.88 : 0.35);
                        [alex, sam].forEach(cChar => {
                            cChar.composite.constraints.forEach(c => {
                                c.stiffness = sVal;
                            });
                        });
                    }
                }

                // Process Visual Modifications
                if (result.visual_modifications) {
                    const vMods = result.visual_modifications;
                    if (vMods.background_theme && THEMES[vMods.background_theme]) {
                        // Override the theme of the current screen
                        const themeName = vMods.background_theme;
                        if (screenComposites[currentScreenX]) {
                            screenComposites[currentScreenX].theme = themeName;
                            showLocationBanner(THEMES[themeName].name + " (OVERRIDE)");
                        }
                    }
                    if (vMods.character_style) {
                        const targetChar = vMods.character_style.name === 'Sam' ? sam : alex;
                        updateCharacterStyle(targetChar, vMods.character_style);
                    }
                }

                if (result.alex_vocal && result.alex_vocal.text) {
                    speak(alex, result.alex_vocal);
                }
                if (result.sam_vocal && result.sam_vocal.text) {
                    speak(sam, result.sam_vocal);
                }
            } catch (err) {
                console.error("[Override Error]", err);
                characters.forEach(char => {
                    const bubble = UI.thoughts[char.name];
                    if (bubble) bubble.style.opacity = '0';
                });
            } finally {
                isUserCommandActive = false;
                inputPill.classList.remove('processing');
            }
        }


        sendBtn.addEventListener('click', () => {
            const text = userInput.value.trim();
            if (!text) return;
            userInput.value = '';
            runInteractiveOverride(text);
        });

        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                sendBtn.click();
            }
        });

        function handleAction(char, action) {
            switch(action) {
                case 'WALK_LEFT': 
                    char.targetX = Math.max(80, char.torso.position.x - 220); 
                    char.isWalking = true; 
                    break;
                case 'WALK_RIGHT': 
                    char.targetX = Math.min(config.width - 80, char.torso.position.x + 220); 
                    char.isWalking = true; 
                    break;
                case 'WALK_TO_TABLE': 
                    char.targetX = furniture.table.position.x + (char.name === 'Alex' ? -80 : 80); 
                    char.isWalking = true; 
                    break;
                case 'JUMP': 
                    if (Math.abs(char.torso.velocity.y) < 1.8) {
                        // crouching phase: contract the legs
                        Body.setAngle(char.legL.thigh, -0.6);
                        Body.setAngle(char.legR.thigh, 0.6);
                        Body.setAngle(char.legL.calf, 0.9);
                        Body.setAngle(char.legR.calf, -0.9);
                        
                        setTimeout(() => {
                            // push-off phase: massive upward force + expand legs straight down
                            Body.applyForce(char.torso, char.torso.position, { x: 0, y: -0.095 });
                            Body.setAngle(char.legL.thigh, 0.15);
                            Body.setAngle(char.legR.thigh, -0.15);
                            Body.setAngle(char.legL.calf, 0.0);
                            Body.setAngle(char.legR.calf, 0.0);
                            emitParticles(char.torso.position.x, char.torso.position.y + 35, 'rgba(226, 232, 240, 0.55)', 7);
                        }, 120);
                    }
                    break;
                case 'WAVE': char.armAction = 'wave'; break;
                case 'FLEX': char.armAction = 'flex'; break;
                case 'GRAB':
                    if (char.grabConstraint) return;
                    // Find any non-static dynamic body close enough (excluding character's own limbs)
                    const items = Composite.allBodies(world).filter(b => {
                        return !b.isStatic && 
                               b.label !== 'ground' && 
                               !b.label.includes('leg') && 
                               !b.label.includes('arm') && 
                               b.label !== 'head' && 
                               b.label !== 'torso';
                    });
                    let targetBlock = null;
                    let minDist = 130;
                    items.forEach(b => {
                        const d = Math.hypot(b.position.x - char.torso.position.x, b.position.y - char.torso.position.y);
                        if (d < minDist) { minDist = d; targetBlock = b; }
                    });

                    if (targetBlock) {
                        char.grabConstraint = Constraint.create({
                            bodyA: char.torso,
                            bodyB: targetBlock,
                            stiffness: 0.45,
                            length: 22,
                            render: { visible: true, strokeStyle: '#ffffff', lineWidth: 1.5 }
                        });
                        Composite.add(world, char.grabConstraint);
                        char.armAction = 'flex';
                    }
                    break;
                case 'RELEASE':
                    if (char.grabConstraint) {
                        Composite.remove(world, char.grabConstraint);
                        char.grabConstraint = null;
                        char.armAction = 'idle';
                    }
                    break;
                case 'THROW':
                    if (char.grabConstraint) {
                        const heldBody = char.grabConstraint.bodyB;
                        Composite.remove(world, char.grabConstraint);
                        char.grabConstraint = null;
                        char.armAction = 'idle';

                        // Apply throwing vector force based on facing direction
                        const dir = char.facing;
                        Body.applyForce(heldBody, heldBody.position, { 
                            x: dir * 0.045 * heldBody.mass, 
                            y: -0.025 * heldBody.mass 
                        });

                        // Task 15: Thrown data tracking
                        heldBody.thrownBy = char;
                        heldBody.throwTime = Date.now();
                        char.stats.throws += 1;

                        // Briefly trigger a wave motion to show the throw animation
                        char.armAction = 'wave';
                        setTimeout(() => {
                            if (char.armAction === 'wave') char.armAction = 'idle';
                        }, 500);
                    }
                    break;
                case 'IDLE':
                    char.isWalking = false;
                    char.armAction = 'idle';
                    break;
            }
        }

        async function speak(char, vocal) {
            const bubble = UI.bubbles?.[char.name];
            const viz = UI.vocalViz?.[char.name];
            if (!bubble) return;
            
            const text = vocal.text || "";
            const mode = vocal.mode || 'speech';
            
            bubble.textContent = text;
            bubble.className = `speech-bubble ${mode}`;
            bubble.style.display = 'block';

            requestAnimationFrame(() => { if (bubble) bubble.style.opacity = '1'; });
            
            if (mode === 'electronic' && vocal.fx) {
                if (viz) viz.classList.add('active');
                await playToneSequence(vocal.fx);
                if (viz) viz.classList.remove('active');
            } else {
                await playProceduralVocal(char, text, mode, vocal.vocal_params || {});
            }
            
            if (bubble) {
                bubble.style.opacity = '0';
                setTimeout(() => { 
                    if (bubble) {
                        bubble.style.display = 'none';
                    }
                }, 800);
            }
        }

        // Physics Update Solver
        Events.on(engine, 'beforeUpdate', () => {
            // Continuous camera tracking of midpoint of Alex and Sam
            const alexX = alex.torso ? alex.torso.position.x : 0;
            const samX = sam.torso ? sam.torso.position.x : 0;
            const midX = (alexX + samX) / 2;

            // Absolute level boundaries clamping (between screen -5 and screen 5)
            const minWorldX = -5 * config.width + 40;
            const maxWorldX = 6 * config.width - 40;
            characters.forEach(char => {
                if (char && char.torso) {
                    const tx = char.torso.position.x;
                    if (tx < minWorldX) {
                        Body.setPosition(char.torso, { x: minWorldX, y: char.torso.position.y });
                    } else if (tx > maxWorldX) {
                        Body.setPosition(char.torso, { x: maxWorldX, y: char.torso.position.y });
                    }
                }
            });

            // Distance limit constraint (prevent separating off-screen, max separation is 80% screen width)
            const dx = alexX - samX;
            const maxSeparation = config.width * 0.8;
            if (Math.abs(dx) > maxSeparation) {
                const centerMidX = (alexX + samX) / 2;
                const halfSep = maxSeparation / 2;
                if (alexX > samX) {
                    Body.setPosition(alex.torso, { x: centerMidX + halfSep, y: alex.torso.position.y });
                    Body.setPosition(sam.torso, { x: centerMidX - halfSep, y: sam.torso.position.y });
                } else {
                    Body.setPosition(alex.torso, { x: centerMidX - halfSep, y: alex.torso.position.y });
                    Body.setPosition(sam.torso, { x: centerMidX + halfSep, y: sam.torso.position.y });
                }
            }

            // Target camera position is centered on the midpoint
            const targetCameraX = Math.max(-5 * config.width, Math.min(5 * config.width, midX - config.width / 2));
            cameraX += (targetCameraX - cameraX) * 0.055; // Lerp smoothly

            const shakeX = (Math.random() - 0.5) * screenshake;
            const shakeY = (Math.random() - 0.5) * screenshake;

            render.bounds.min.x = cameraX + shakeX;
            render.bounds.max.x = cameraX + config.width + shakeX;
            render.bounds.min.y = shakeY;
            render.bounds.max.y = config.height + shakeY;
            Mouse.setOffset(mouse, { x: cameraX + shakeX, y: shakeY });

            // Trigger screen transition banners when camera crosses sector centers
            const newScreenIdx = Math.round(cameraX / config.width);
            if (newScreenIdx !== currentScreenX) {
                currentScreenX = newScreenIdx;
                const sKey = String(currentScreenX);
                // Pre-generate neighbours
                procedurallyGenerateScreen(currentScreenX);
                procedurallyGenerateScreen(currentScreenX - 1);
                procedurallyGenerateScreen(currentScreenX + 1);

                const lvl = LEVEL_DEFS[sKey] || LEVEL_DEFS['0'];
                showLocationBanner(lvl.name);
            }

            // Proximity loading / unloading of screen composites to optimize performance
            for (let s = -5; s <= 5; s++) {
                const comp = procedurallyGenerateScreen(s);
                const inRange = Math.abs(s - currentScreenX) <= 1;
                const allComps = Composite.allComposites(world);
                const isAdded = allComps.includes(comp);
                
                if (inRange && !isAdded) {
                    Composite.add(world, comp);
                } else if (!inRange && isAdded) {
                    Composite.remove(world, comp);
                }
            }

            // Transition canvas background color
            const currentTheme = THEMES[screenComposites[String(currentScreenX)]?.theme || 'meadow'];
            if (currentTheme && render.canvas) {
                render.canvas.style.background = currentTheme.wall;
            }

            // Process the scene schedule timeline
            processSceneTimeline();

            // Table/Chair alignment lock
            Object.values(furniture).forEach(item => {
                if (item) {
                    const torqueValue = (0 - item.angle) * 0.15 - item.angularVelocity * 0.08;
                    item.torque += torqueValue;
                }
            });

            // Balloon buoyancy, Wind force, Background gears animation, & Conveyor Belt zone physics
            factoryGearsAngle += 0.012;
            clouds.forEach(c => {
                c.x = (c.x + c.speed) % (config.width * 11);
            });

            // Screenshake damping decay
            screenshake = Math.max(0, screenshake * 0.86);

            Composite.allBodies(world).forEach(b => {
                if (!b.isStatic) {
                    // Prevent glitchy clipping by capping maximum velocity
                    const maxSpeed = 17.5;
                    const speed = Math.hypot(b.velocity.x, b.velocity.y);
                    if (speed > maxSpeed) {
                        const ratio = maxSpeed / speed;
                        Body.setVelocity(b, { x: b.velocity.x * ratio, y: b.velocity.y * ratio });
                    }
                }

                if (b.buoyant) {
                    Body.applyForce(b, b.position, { x: 0, y: -0.0006 });
                }
                if (!b.isStatic && activeWindX !== 0) {
                    Body.applyForce(b, b.position, { x: activeWindX * b.mass * 0.00008, y: 0 });
                }

                // Task 8: Swamp Water pond buoyancy + drag (Screen -1)
                if (!b.isStatic && b.label !== 'ground') {
                    const pondMinX = -1 * config.width + config.width * 0.15;
                    const pondMaxX = -1 * config.width + config.width * 0.85;
                    const waterTop = config.groundY - 95;
                    if (b.position.x > pondMinX && b.position.x < pondMaxX && b.position.y > waterTop && b.position.y < config.groundY) {
                        Body.applyForce(b, b.position, { x: 0, y: -0.0031 * b.mass });
                        Body.setVelocity(b, { x: b.velocity.x * 0.85, y: b.velocity.y * 0.81 });
                        if (Math.random() < 0.07 && Math.hypot(b.velocity.x, b.velocity.y) > 0.4) {
                            emitParticles(b.position.x, b.position.y, '#38bdf8', 1);
                        }
                    }
                }

                // Conveyor zones
                if (!b.isStatic && b.label !== 'ground' && !b.label.includes('leg') && !b.label.includes('arm') && b.label !== 'head' && b.label !== 'torso') {
                    const cy = config.groundY - 160;
                    
                    // Screen -4: conveyor pushes leftward
                    const scMinus4X = -4 * config.width;
                    if (b.position.x > scMinus4X + config.width * 0.2 && b.position.x < scMinus4X + config.width * 0.8) {
                        if (Math.abs(b.position.y - (cy - 18)) < 22) {
                            Body.setVelocity(b, { x: -2.2, y: b.velocity.y });
                        }
                    }
                    
                    // Screen 4: conveyor pushes rightward
                    const scPlus4X = 4 * config.width;
                    if (b.position.x > scPlus4X + config.width * 0.2 && b.position.x < scPlus4X + config.width * 0.8) {
                        if (Math.abs(b.position.y - (cy - 18)) < 22) {
                            Body.setVelocity(b, { x: 2.2, y: b.velocity.y });
                        }
                    }
                }

                // Swirling Tornado Vortex zones (Screen -5 and Screen 3)
                if (!b.isStatic) {
                    const onScreen3 = (b.position.x > 3 * config.width && b.position.x < 4 * config.width);
                    const onScreenMinus5 = (b.position.x > -5 * config.width && b.position.x < -4 * config.width);
                    if (onScreen3 || onScreenMinus5) {
                        const vx = (onScreen3 ? 3 : -5) * config.width + config.width / 2;
                        const vy = 200;
                        const dx = vx - b.position.x;
                        const dy = vy - b.position.y;
                        const dist = Math.hypot(dx, dy);
                        
                        if (dist < 230 && dist > 10) {
                            // Pull inward force
                            const fPull = 0.00015 * b.mass;
                            const ux = dx / dist;
                            const uy = dy / dist;
                            
                            // Perpendicular swirling force
                            const tx = -uy;
                            const ty = ux;
                            const fSwirl = 0.00012 * b.mass;

                            Body.applyForce(b, b.position, {
                                x: ux * fPull + tx * fSwirl,
                                y: uy * fPull + ty * fSwirl
                            });
                        }
                    }
                }
            });

            // Combat checks (swords hit targets)
            characters.forEach(attacker => {
                if (attacker.grabConstraint && attacker.grabConstraint.bodyB.label === 'sword') {
                    const sword = attacker.grabConstraint.bodyB;
                    characters.forEach(target => {
                        if (target === attacker || target.isFainted) return;
                        const dist = Math.hypot(sword.position.x - target.torso.position.x, sword.position.y - target.torso.position.y);
                        // If sword is within 65px and is swinging/moving
                        if (dist < 65 && Math.hypot(sword.velocity.x, sword.velocity.y) > 2.0) {
                            if (!target.lastHitTime || Date.now() - target.lastHitTime > 800) {
                                target.lastHitTime = Date.now();
                                
                                // Parry check (Task 27)
                                const targetHoldsSword = target.grabConstraint && target.grabConstraint.bodyB.label === 'sword';
                                const isFacingOpposite = (attacker.facing !== target.facing);
                                if (targetHoldsSword && isFacingOpposite) {
                                    const isPerfect = (Date.now() - target.swingStartTime < 320);
                                    if (isPerfect) {
                                        emitParticles(sword.position.x, sword.position.y, '#f59e0b', 24);
                                        emitTextOverlay(target.torso.position.x, target.torso.position.y - 30, 'PERFECT PARRY!', '#facc15');
                                        
                                        // Stun and knock back attacker
                                        attacker.stunEndTime = Date.now() + 700;
                                        Body.setVelocity(attacker.torso, { x: -attacker.facing * 5, y: -3.5 });
                                        emitParticles(attacker.head.position.x, attacker.head.position.y, '#e2e8f0', 8);

                                        playToneSequence([
                                            { note: 'B5', duration: '16n' },
                                            { note: 'D6', duration: '16n' },
                                            { note: 'F#6', duration: '8n' }
                                        ]);
                                        screenshake = 10;
                                    } else {
                                        emitParticles(sword.position.x, sword.position.y, '#fbbf24', 16);
                                        emitTextOverlay(target.torso.position.x, target.torso.position.y - 30, 'PARRY!', '#fbbf24');
                                        playToneSequence([
                                            { note: 'B5', duration: '16n' },
                                            { note: 'B5', duration: '16n' }
                                        ]);
                                        screenshake = 5;
                                    }
                                } else {
                                    damageCharacter(target, 25);
                                    emitParticles(sword.position.x, sword.position.y, '#f59e0b', 14); // clash spark
                                    attacker.stats.damageDealt += 25;
                                }
                            }
                        }
                    });
                }
            });

            characters.forEach(char => {
                if (!char || !char.torso) return;

                // Faint recovery timer check
                if (char.isFainted) {
                    if (Date.now() - char.faintTime > 4500) {
                        char.isFainted = false;
                        char.hp = 100;
                        char.stamina = 100;
                        speak(char, { text: "I am revived!", mode: 'shout' });
                        emitTextOverlay(char.torso.position.x, char.torso.position.y - 30, 'REVIVED!', '#10b981');
                        char.stats.revives += 1;
                    }
                    // Skip balance torque and active controls while fainted (fall limp)
                    return;
                }

                // Stamina regeneration
                char.stamina = Math.min(100, char.stamina + 0.45);

                // Keep head and body upright
                char.torso.torque += (0 - char.torso.angle) * 0.25 - char.torso.angularVelocity * 0.1;
                char.head.torque += (0 - char.head.angle) * 0.2 - char.head.angle * 0.1;

                if (char.isUserControlled) {
                    if (char.stunEndTime && Date.now() < char.stunEndTime) {
                        Body.setVelocity(char.torso, { x: char.torso.velocity.x * 0.80, y: char.torso.velocity.y });
                        return;
                    }

                    // Manual Override Controller (Player 1: WASD + F, Player 2: Arrows + P)
                    const isAlex = char.name === 'Alex';
                    const leftKey = isAlex ? 'KeyA' : 'ArrowLeft';
                    const rightKey = isAlex ? 'KeyD' : 'ArrowRight';
                    const jumpKey = isAlex ? 'KeyW' : 'ArrowUp';

                    const speedMult = char.stamina < 25 ? 0.60 : 1.0;

                    if (activeKeys[leftKey]) {
                        const isStuck = Math.abs(char.torso.velocity.x) < 0.2;
                        const forceMag = isStuck ? 0.0012 : 0.0042;
                        Body.applyForce(char.torso, char.torso.position, { x: -forceMag * speedMult, y: 0 });
                        Body.applyForce(char.legL.foot, char.legL.foot.position, { x: -forceMag * 0.4 * speedMult, y: 0 });
                        Body.applyForce(char.legR.foot, char.legR.foot.position, { x: -forceMag * 0.4 * speedMult, y: 0 });
                        char.facing = -1;
                        char.animTime += 0.2 * speedMult;
                        const legAngle = Math.sin(char.animTime) * 0.5;
                        Body.setAngle(char.legL.thigh, legAngle);
                        Body.setAngle(char.legR.thigh, -legAngle);
                        Body.setAngle(char.legL.calf, legAngle * 0.5);
                        Body.setAngle(char.legR.calf, -legAngle * 0.5);
                    } else if (activeKeys[rightKey]) {
                        const isStuck = Math.abs(char.torso.velocity.x) < 0.2;
                        const forceMag = isStuck ? 0.0012 : 0.0042;
                        Body.applyForce(char.torso, char.torso.position, { x: forceMag * speedMult, y: 0 });
                        Body.applyForce(char.legL.foot, char.legL.foot.position, { x: forceMag * 0.4 * speedMult, y: 0 });
                        Body.applyForce(char.legR.foot, char.legR.foot.position, { x: forceMag * 0.4 * speedMult, y: 0 });
                        char.facing = 1;
                        char.animTime += 0.2 * speedMult;
                        const legAngle = Math.sin(char.animTime) * 0.5;
                        Body.setAngle(char.legL.thigh, legAngle);
                        Body.setAngle(char.legR.thigh, -legAngle);
                        Body.setAngle(char.legL.calf, legAngle * 0.5);
                        Body.setAngle(char.legR.calf, -legAngle * 0.5);
                    } else {
                        // Task 2 Stop Dampener
                        Body.setVelocity(char.torso, { x: char.torso.velocity.x * 0.82, y: char.torso.velocity.y });
                        char.legL.thigh.torque += (0 - char.legL.thigh.angle) * 0.05;
                        char.legR.thigh.torque += (0 - char.legR.thigh.angle) * 0.05;
                    }

                    if (activeKeys[jumpKey]) {
                        if (Math.abs(char.torso.velocity.y) < 1.5) {
                            Body.applyForce(char.torso, char.torso.position, { x: 0, y: -0.065 });
                        }
                    }
                } else {
                    // Baseline AI Sophistication Subsystem
                    let aiWalked = false;
                    const otherChar = characters.find(c => c !== char);
                    
                    // 1. Check for Health Potions
                    let targetObj = null;
                    if (char.hp < 75) {
                        const allPotions = Composite.allBodies(world).filter(b => b.label === 'potion');
                        let closestDist = Infinity;
                        allPotions.forEach(pot => {
                            const d = Math.hypot(pot.position.x - char.torso.position.x, pot.position.y - char.torso.position.y);
                            if (d < closestDist && d < 350) {
                                closestDist = d;
                                targetObj = pot;
                            }
                        });
                    }

                    // 2. Check for Weapons if unarmed
                    const holdsWeapon = char.grabConstraint !== null;
                    if (!holdsWeapon && !targetObj) {
                        const allWeapons = Composite.allBodies(world).filter(b => b.label === 'sword' || b.label === 'gun');
                        let closestDist = Infinity;
                        allWeapons.forEach(wep => {
                            const isHeld = characters.some(c => c.grabConstraint && c.grabConstraint.bodyB === wep);
                            if (!isHeld) {
                                const d = Math.hypot(wep.position.x - char.torso.position.x, wep.position.y - char.torso.position.y);
                                if (d < closestDist && d < 300) {
                                    closestDist = d;
                                    targetObj = wep;
                                }
                            }
                        });
                    }

                    // 3. Combat logic / Walk to target
                    let targetPos = null;
                    if (targetObj) {
                        targetPos = targetObj.position;
                    } else if (otherChar && !otherChar.isFainted) {
                        targetPos = otherChar.torso.position;
                    }

                    if (targetPos) {
                        const dx = targetPos.x - char.torso.position.x;
                        const dist = Math.abs(dx);
                        
                        // Grab weapon
                        if (targetObj && dist < 45 && Math.abs(targetObj.position.y - char.torso.position.y) < 70) {
                            char.grabConstraint = Constraint.create({
                                bodyA: char.armR.hand,
                                bodyB: targetObj,
                                pointA: { x: 0, y: 0 },
                                pointB: { x: 0, y: 0 },
                                stiffness: 0.9,
                                length: 2
                            });
                            Composite.add(world, char.grabConstraint);
                            playToneSequence([{ note: 'A4', duration: '16n' }]);
                        }

                        // Auto-attack
                        if (holdsWeapon) {
                            const weapon = char.grabConstraint.bodyB;
                            if (weapon.label === 'sword' && dist < 65) {
                                if (char.armAction !== 'swing' && Date.now() - char.swingStartTime > 900) {
                                    char.armAction = 'swing';
                                    char.swingStartTime = Date.now();
                                    playToneSequence([{ note: 'A5', duration: '16n' }]);
                                    setTimeout(() => {
                                        if (char.armAction === 'swing') char.armAction = 'idle';
                                    }, 280);
                                }
                            } else if (weapon.label === 'gun' && dist < 400) {
                                if (Math.random() < 0.02) {
                                    shootGun(char);
                                }
                            }
                        }

                        // Move towards target
                        if (dist > (holdsWeapon && char.grabConstraint.bodyB.label === 'sword' ? 45 : 20)) {
                            const dir = Math.sign(dx);
                            const forceMag = 0.0038;
                            Body.applyForce(char.torso, char.torso.position, { x: dir * forceMag, y: 0 });
                            Body.applyForce(char.legL.foot, char.legL.foot.position, { x: dir * forceMag * 0.4, y: 0 });
                            Body.applyForce(char.legR.foot, char.legR.foot.position, { x: dir * forceMag * 0.4, y: 0 });
                            char.facing = dir;
                            
                            char.animTime += 0.2;
                            const legAngle = Math.sin(char.animTime) * 0.5;
                            Body.setAngle(char.legL.thigh, legAngle);
                            Body.setAngle(char.legR.thigh, -legAngle);
                            Body.setAngle(char.legL.calf, legAngle * 0.5);
                            Body.setAngle(char.legR.calf, -legAngle * 0.5);
                            aiWalked = true;
                        }
                    }

                    if (!aiWalked) {
                        char.legL.thigh.torque += (0 - char.legL.thigh.angle) * 0.05;
                        char.legR.thigh.torque += (0 - char.legR.thigh.angle) * 0.05;
                    }
                }


                // Arm solver
                if (char.armAction === 'wave') {
                    const waveAngle = Math.sin(Date.now() * 0.012) * 0.8 - 1.2;
                    Body.setAngle(char.armL.upper, waveAngle);
                    Body.setAngle(char.armL.lower, waveAngle * 0.5);
                } else if (char.armAction === 'flex') {
                    Body.setAngle(char.armL.upper, -1.2);
                    Body.setAngle(char.armR.upper, 1.2);
                    Body.setAngle(char.armL.lower, -0.6);
                    Body.setAngle(char.armR.lower, 0.6);
                } else if (char.armAction === 'swing') {
                    const elapsed = Date.now() - char.swingStartTime;
                    const progress = Math.min(1.0, elapsed / 280);
                    const startAngle = char.facing === 1 ? -1.8 : 0.6;
                    const endAngle = char.facing === 1 ? 1.0 : -2.2;
                    const targetAngle = startAngle + (endAngle - startAngle) * progress;
                    if (char.facing === 1) {
                        Body.setAngle(char.armR.upper, targetAngle);
                        Body.setAngle(char.armR.lower, targetAngle * 0.5);
                    } else {
                        Body.setAngle(char.armL.upper, targetAngle);
                        Body.setAngle(char.armL.lower, targetAngle * 0.5);
                    }
                } else {
                    char.armL.upper.torque += (0.2 - char.armL.upper.angle) * 0.05;
                    char.armR.upper.torque += (-0.2 - char.armR.upper.angle) * 0.05;
                }

                // Sync UI bubble and vocal viz positions (relative to cameraX)
                const headPos = char.head.position;
                const bubbleEl = UI.bubbles[char.name];
                if (bubbleEl) {
                    bubbleEl.style.left = `${headPos.x - cameraX}px`;
                    bubbleEl.style.top = `${headPos.y - 25}px`;
                }
                const thoughtEl = UI.thoughts[char.name];
                if (thoughtEl) {
                    thoughtEl.style.left = `${headPos.x - cameraX}px`;
                    thoughtEl.style.top = `${headPos.y - 45}px`;
                }
                const vizEl = UI.vocalViz[char.name];
                if (vizEl) {
                    vizEl.style.left = `${headPos.x - cameraX}px`;
                    vizEl.style.top = `${headPos.y}px`;
                }

                // Boundary recovery inside current active screen
                if (char.torso.position.y > config.height + 100) {
                    const spawnX = currentScreenX * config.width + config.width / 2;
                    Body.setPosition(char.torso, { x: spawnX, y: 150 });
                    Body.setVelocity(char.torso, { x: 0, y: 0 });
                }
            });
        });

        function getSkyGradient(ctx) {
            const themeName = screenComposites[currentScreenX]?.theme || 'meadow';
            const colors = {
                meadow: ['#7dd3fc', '#e0f2fe'],
                junkyard: ['#52525b', '#27272a'],
                castle: ['#4b5563', '#1f2937'],
                crystal_cave: ['#2e1065', '#0f052d'],
                factory: ['#1e2937', '#0f172a']
            };
            const pair = colors[themeName] || colors.meadow;
            const grad = ctx.createLinearGradient(0, 0, 0, config.height);
            grad.addColorStop(0, pair[0]);
            grad.addColorStop(1, pair[1]);
            return grad;
        }

        Events.on(render, 'beforeRender', () => {
            const ctx = canvas.getContext('2d');
            const activeTheme = screenComposites[String(currentScreenX)]?.theme || 'meadow';
            
            // Draw sky gradient
            ctx.fillStyle = getSkyGradient(ctx);
            ctx.fillRect(0, 0, config.width, config.height);

            // Task 10: Parallax Background Mountains
            ctx.save();
            ctx.fillStyle = activeTheme === 'crystal_cave' ? 'rgba(30, 27, 75, 0.45)' : (activeTheme === 'factory' ? 'rgba(51, 65, 85, 0.42)' : 'rgba(6, 95, 70, 0.38)');
            ctx.beginPath();
            const mountainOffset = -(cameraX * 0.24) % (config.width * 2);
            ctx.moveTo(0, config.height);
            for (let mx = -config.width; mx < config.width * 3; mx += 360) {
                const my = config.groundY - 145 - Math.sin(mx * 0.005) * 50;
                ctx.lineTo(mx + mountainOffset, config.height);
                ctx.lineTo(mx + 180 + mountainOffset, my);
                ctx.lineTo(mx + 360 + mountainOffset, config.height);
            }
            ctx.closePath();
            ctx.fill();
            ctx.restore();

            // Draw clouds if meadow theme
            if (activeTheme === 'meadow') {
                ctx.save();
                ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
                clouds.forEach(c => {
                    // map cloud position back to screen camera space
                    const cx = (c.x - cameraX + config.width * 2) % (config.width * 2) - config.width;
                    ctx.beginPath();
                    ctx.arc(cx, c.y, c.size, 0, Math.PI * 2);
                    ctx.arc(cx + c.size * 0.6, c.y - c.size * 0.3, c.size * 0.8, 0, Math.PI * 2);
                    ctx.arc(cx - c.size * 0.6, c.y, c.size * 0.7, 0, Math.PI * 2);
                    ctx.arc(cx + c.size * 1.2, c.y, c.size * 0.6, 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.restore();
            }

            // Draw floating glowing dust if crystal cave theme
            if (activeTheme === 'crystal_cave') {
                ctx.save();
                caveParticles.forEach(p => {
                    p.y += p.vy;
                    if (p.y < 0) p.y = config.height;
                    
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x - cameraX, p.y, p.r, 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.restore();

                // Draw central swirling vortex wind spiral
                ctx.save();
                ctx.strokeStyle = 'rgba(192, 132, 252, 0.16)';
                ctx.lineWidth = 2.0;
                
                // Centered on current screen center
                const cx = (currentScreenX * config.width + config.width / 2) - cameraX;
                const cy = 200;
                const t = Date.now() * 0.005;
                ctx.beginPath();
                for (let angle = 0; angle < Math.PI * 6; angle += 0.1) {
                    const r = angle * 8.5 + (Math.sin(t + angle) * 4);
                    const sx = cx + Math.cos(angle + t) * r;
                    const sy = cy + Math.sin(angle + t) * r;
                    if (angle === 0) ctx.moveTo(sx, sy);
                    else ctx.lineTo(sx, sy);
                }
                ctx.stroke();
                ctx.restore();
            }

            // Draw background rotating gears if factory theme
            if (activeTheme === 'factory') {
                ctx.save();
                ctx.fillStyle = 'rgba(30, 41, 59, 0.18)';
                
                // Gear 1
                ctx.save();
                ctx.translate(250, 180);
                ctx.rotate(factoryGearsAngle);
                for (let i = 0; i < 8; i++) {
                    ctx.rotate(Math.PI / 4);
                    ctx.fillRect(-12, -50, 24, 100);
                }
                ctx.beginPath();
                ctx.arc(0, 0, 38, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                // Gear 2
                ctx.save();
                ctx.translate(680, 260);
                ctx.rotate(-factoryGearsAngle * 1.2);
                for (let i = 0; i < 8; i++) {
                    ctx.rotate(Math.PI / 4);
                    ctx.fillRect(-10, -40, 20, 80);
                }
                ctx.beginPath();
                ctx.arc(0, 0, 30, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
                
                ctx.restore();
            }
        });

        Events.on(render, 'afterRender', () => {
            const ctx = canvas.getContext('2d');

            // Task 14: Dynamic Drop Shadows
            ctx.save();
            const allBodies2 = Composite.allBodies(world);
            allBodies2.forEach(b => {
                if (!b.isStatic && b.label !== 'ground' && !b.label.includes('leg') && !b.label.includes('arm') && b.label !== 'bullet') {
                    const groundY = config.groundY;
                    const h = groundY - b.position.y;
                    if (h > 0 && h < 400) {
                        const shadowW = Math.max(8, (b.circleRadius ? b.circleRadius * 1.2 : 28) * (1 - h / 400));
                        const opacity = Math.max(0, 0.32 * (1 - h / 400));
                        ctx.fillStyle = `rgba(15, 23, 42, ${opacity})`;
                        ctx.beginPath();
                        ctx.ellipse(b.position.x - cameraX, groundY, shadowW, shadowW * 0.25, 0, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            });
            ctx.restore();

            // Update and draw active temporary particles (dust, sparks, explosions)
            ctx.save();
            // Task 12: Particle pool updates
            for (let i = 0; i < PARTICLE_POOL_SIZE; i++) {
                const p = particlePool[i];
                if (p.active) {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life -= p.decay;
                    if (p.life <= 0) {
                        p.active = false;
                        continue;
                    }
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.life;
                    ctx.beginPath();
                    ctx.arc(p.x - cameraX, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            ctx.restore();

            // Task 29: Update and draw floating text overlays
            ctx.save();
            ctx.font = 'bold 13px "Outfit", system-ui, sans-serif';
            ctx.textAlign = 'center';
            for (let i = activeTextOverlays.length - 1; i >= 0; i--) {
                const t = activeTextOverlays[i];
                t.x += t.vx;
                t.y += t.vy;
                t.life -= 0.024;
                if (t.life <= 0) {
                    activeTextOverlays.splice(i, 1);
                    continue;
                }
                ctx.fillStyle = t.color;
                ctx.globalAlpha = t.life;
                ctx.fillText(t.text, t.x - cameraX, t.y);
            }
            ctx.restore();
            
            // Custom Painter overlays to enrich map design aesthetics
            const allBodies = Composite.allBodies(world);
            allBodies.forEach(b => {
                if (b.isStatic) {
                    const minX = b.bounds.min.x - cameraX;
                    const maxX = b.bounds.max.x - cameraX;
                    const minY = b.bounds.min.y;
                    const maxY = b.bounds.max.y;
                    const w = b.bounds.max.x - b.bounds.min.x;
                    const h = b.bounds.max.y - b.bounds.min.y;

                    // 1. Meadows Grass Blades decoration
                    if (b.render.fillStyle === '#166534') {
                        ctx.fillStyle = '#22c55e';
                        for (let gx = minX + 8; gx < maxX - 8; gx += 20) {
                            ctx.beginPath();
                            ctx.moveTo(gx, minY);
                            ctx.lineTo(gx - 3, minY - 7);
                            ctx.lineTo(gx + 2, minY);
                            ctx.lineTo(gx + 5, minY - 10);
                            ctx.lineTo(gx + 8, minY);
                            ctx.fill();
                        }
                    }

                    // 2. Castle and Factory masonry joints / panels
                    if (b.render.fillStyle === '#1e293b' || b.render.fillStyle === '#3f3f46' || b.render.fillStyle === '#27272a') {
                        ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
                        ctx.lineWidth = 1.2;
                        
                        // horizontal layers
                        for (let y = minY + 15; y < maxY; y += 20) {
                            ctx.beginPath();
                            ctx.moveTo(minX, y);
                            ctx.lineTo(maxX, y);
                            ctx.stroke();
                        }
                        
                        // vertical lines (staggered joints)
                        let row = 0;
                        for (let y = minY; y < maxY; y += 20) {
                            const shift = (row % 2) * 18;
                            for (let x = minX + shift; x < maxX; x += 36) {
                                ctx.beginPath();
                                ctx.moveTo(x, y);
                                ctx.lineTo(x, y + 20);
                                ctx.stroke();
                            }
                            row++;
                        }
                    }

                    // 3. Crystal Cavern cracks & sparkling facets
                    if (b.render.fillStyle === '#30103c' || b.render.fillStyle === '#8b5cf6') {
                        ctx.strokeStyle = 'rgba(192, 132, 252, 0.22)';
                        ctx.lineWidth = 1.0;
                        ctx.beginPath();
                        ctx.moveTo(minX, minY);
                        ctx.lineTo(maxX, maxY);
                        ctx.moveTo(minX + w * 0.45, minY);
                        ctx.lineTo(minX, minY + h * 0.5);
                        ctx.moveTo(maxX - w * 0.3, minY);
                        ctx.lineTo(maxX, minY + h * 0.6);
                        ctx.stroke();
                    }

                    // 4. Moving Arrows for Conveyor Catwalks
                    if (b.label === 'conveyor') {
                        const cy = b.position.y;
                        const isLeft = (b.position.x < 0);
                        const dir = isLeft ? -1 : 1;
                        const arrowOffset = (Date.now() * 0.04 * dir) % 24;
                        ctx.fillStyle = 'rgba(245, 158, 11, 0.65)';
                        
                        for (let ax = minX + 12 + arrowOffset; ax < maxX - 12; ax += 24) {
                            ctx.beginPath();
                            ctx.moveTo(ax, cy - 3);
                            ctx.lineTo(ax + dir * 5, cy);
                            ctx.lineTo(ax, cy + 3);
                            ctx.fill();
                        }
                    }
                }
            });

            characters.forEach(char => {
                if (char.glow) {
                    ctx.save();
                    ctx.shadowColor = char.colors.shirt;
                    ctx.shadowBlur = 18;
                    ctx.strokeStyle = char.colors.shirt;
                    ctx.lineWidth = 4;
                    
                    // Draw outer glowing halo rings
                    ctx.beginPath();
                    ctx.arc(char.head.position.x - cameraX, char.head.position.y, 16, 0, Math.PI * 2);
                    ctx.stroke();
                    
                    ctx.beginPath();
                    ctx.roundRect(char.torso.position.x - cameraX - 15, char.torso.position.y - 27, 30, 54, 9);
                    ctx.stroke();
                    ctx.restore();
                }

                if (char.isUserControlled) {
                    ctx.save();
                    ctx.font = 'bold 12px "Outfit", system-ui, sans-serif';
                    ctx.fillStyle = char.name === 'Alex' ? '#38bdf8' : '#f43f5e';
                    ctx.textAlign = 'center';
                    
                    const label = char.name === 'Alex' ? 'P1 (WASD+F)' : 'P2 (ARROWS+P)';
                    const headPos = char.head.position;
                    
                    ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
                    ctx.strokeStyle = char.name === 'Alex' ? '#38bdf8' : '#f43f5e';
                    ctx.lineWidth = 1.5;
                    
                    const textWidth = ctx.measureText(label).width;
                    const bx = headPos.x - cameraX - textWidth/2 - 10;
                    const by = headPos.y - 48;
                    const bw = textWidth + 20;
                    const bh = 22;
                    
                    ctx.beginPath();
                    ctx.roundRect(bx, by, bw, bh, 6);
                    ctx.fill();
                    ctx.stroke();
                    
                    ctx.fillStyle = '#ffffff';
                    ctx.fillText(label, headPos.x - cameraX, headPos.y - 33);
                    ctx.restore();
                }

                // Draw HP bar above character's head
                const headPos = char.head.position;
                const hpBarW = 44;
                const hpBarH = 5;
                const hx = headPos.x - cameraX - hpBarW/2;
                const hy = headPos.y - 25;
                
                ctx.save();
                ctx.fillStyle = 'rgba(15, 23, 42, 0.7)';
                ctx.fillRect(hx, hy, hpBarW, hpBarH);
                
                // Color gradient for health: green -> red
                ctx.fillStyle = char.isFainted ? '#64748b' : (char.hp > 40 ? '#10b981' : '#ef4444');
                ctx.fillRect(hx, hy, (char.hp / 100) * hpBarW, hpBarH);

                // Draw Stamina bar below HP bar (Task 22)
                const stamBarH = 3;
                const sty = hy + 6;
                ctx.fillStyle = 'rgba(15, 23, 42, 0.7)';
                ctx.fillRect(hx, sty, hpBarW, stamBarH);
                ctx.fillStyle = (char.stamina < 25 && Math.floor(Date.now() / 250) % 2 === 0) ? '#ef4444' : '#06b6d4';
                ctx.fillRect(hx, sty, (char.stamina / 100) * hpBarW, stamBarH);
                ctx.restore();

                // Draw spinning stars above head if fainted
                if (char.isFainted) {
                    ctx.save();
                    ctx.translate(headPos.x - cameraX, headPos.y - 36);
                    const rot = (Date.now() * 0.007) % (Math.PI * 2);
                    ctx.fillStyle = '#fbbf24';
                    for (let star = 0; star < 3; star++) {
                        const angle = rot + (star * Math.PI * 2 / 3);
                        const sx = Math.cos(angle) * 11;
                        const sy = Math.sin(angle) * 5;
                        ctx.beginPath();
                        ctx.arc(sx, sy, 2.2, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.restore();
                }

                // Task 9: Floating Grab Indicator for weapons
                if (char.isUserControlled && !char.grabConstraint && !char.isFainted) {
                    const bodies = Composite.allBodies(world);
                    bodies.forEach(b => {
                        if (b.label === 'sword' || b.label === 'gun' || b.label === 'tnt') {
                            const d = Math.hypot(b.position.x - char.torso.position.x, b.position.y - char.torso.position.y);
                            if (d < 72) {
                                ctx.save();
                                ctx.font = 'bold 9px "Outfit", system-ui, sans-serif';
                                ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
                                ctx.strokeStyle = '#eab308';
                                ctx.lineWidth = 1.0;
                                const grabKeyName = char.name === 'Alex' ? 'S' : '↓';
                                const txt = `[${grabKeyName}] Grab ${b.label.toUpperCase()}`;
                                const textW = ctx.measureText(txt).width;
                                
                                const bx = b.position.x - cameraX - textW/2 - 5;
                                const by = b.position.y - 32;
                                ctx.beginPath();
                                ctx.roundRect(bx, by, textW + 10, 14, 3);
                                ctx.fill();
                                ctx.stroke();
                                
                                ctx.fillStyle = '#ffffff';
                                ctx.fillText(txt, b.position.x - cameraX - textW/2, b.position.y - 22);
                                ctx.restore();
                            }
                        }
                    });
                }
            });

            // Task 8: Draw Swamp Pond Water Overlay (Screen -1)
            const pondMinX = -1 * config.width + config.width * 0.15;
            const pondWidth = config.width * 0.70;
            const waterTop = config.groundY - 95;
            
            if (cameraX + config.width > pondMinX && cameraX < pondMinX + pondWidth) {
                ctx.save();
                ctx.fillStyle = 'rgba(14, 165, 233, 0.42)';
                ctx.fillRect(pondMinX - cameraX, waterTop, pondWidth, 95);
                
                // Draw white wave caps
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.48)';
                ctx.lineWidth = 2.0;
                ctx.beginPath();
                const waveOffset = (Date.now() * 0.0035) % (Math.PI * 2);
                for (let wx = pondMinX; wx <= pondMinX + pondWidth; wx += 8) {
                    const wy = waterTop + Math.sin((wx * 0.05) + waveOffset) * 2.5;
                    if (wx === pondMinX) ctx.moveTo(wx - cameraX, wy);
                    else ctx.lineTo(wx - cameraX, wy);
                }
                ctx.stroke();
                ctx.restore();
            }

            // Task 30: Leaderboard Stats Overlay (TAB key)
            if (activeKeys['Tab']) {
                ctx.save();
                ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
                ctx.fillRect(0, 0, config.width, config.height);

                const sw = Math.min(500, config.width - 60);
                const sh = 280;
                const sx = (config.width - sw) / 2;
                const sy = (config.height - sh) / 2;
                
                ctx.fillStyle = 'rgba(30, 41, 59, 0.95)';
                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 2.0;
                ctx.beginPath();
                ctx.roundRect(sx, sy, sw, sh, 12);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 22px "Outfit", system-ui, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText("SOULS ARENA STATS", sx + sw/2, sy + 38);

                ctx.font = 'bold 13px "Outfit", sans-serif';
                ctx.fillStyle = '#94a3b8';
                ctx.fillText("STATISTIC", sx + 90, sy + 80);
                ctx.fillStyle = '#38bdf8';
                ctx.fillText("ALEX (P1)", sx + sw/2 + 25, sy + 80);
                ctx.fillStyle = '#f43f5e';
                ctx.fillText("SAM (P2)", sx + sw - 65, sy + 80);

                const drawStatRow = (label, key, rowIdx) => {
                    const ry = sy + 112 + rowIdx * 38;
                    ctx.fillStyle = '#ffffff';
                    ctx.font = '13px "Outfit", sans-serif';
                    ctx.textAlign = 'left';
                    ctx.fillText(label, sx + 25, ry);

                    const val1 = alex.stats[key] || 0;
                    const val2 = sam.stats[key] || 0;

                    // Draw horizontal comparison bar
                    const maxVal = Math.max(1, val1 + val2);
                    const barW = 100;
                    const bx = sx + sw/2 - barW/2 + 25;
                    ctx.fillStyle = 'rgba(148, 163, 184, 0.15)';
                    ctx.fillRect(bx, ry + 4, barW, 4);
                    
                    ctx.fillStyle = '#38bdf8'; // P1 (blue)
                    ctx.fillRect(bx, ry + 4, (val1 / maxVal) * barW, 4);

                    // P2 (red) segment
                    ctx.fillStyle = '#f43f5e';
                    ctx.fillRect(bx + (val1 / maxVal) * barW, ry + 4, (val2 / maxVal) * barW, 4);

                    ctx.font = 'bold 13px "Outfit", sans-serif';
                    ctx.textAlign = 'center';
                    
                    // Values
                    ctx.fillStyle = '#e2e8f0';
                    ctx.fillText(val1, sx + sw/2 - 20, ry);
                    ctx.fillText(val2, sx + sw - 65, ry);

                    // Leader stars highlights
                    if (val1 > val2) {
                        ctx.fillStyle = '#fbbf24';
                        ctx.fillText("★", sx + sw/2 - 42, ry);
                    } else if (val2 > val1) {
                        ctx.fillStyle = '#fbbf24';
                        ctx.fillText("★", sx + sw - 90, ry);
                    }
                };

                drawStatRow("Total Damage Dealt", "damageDealt", 0);
                drawStatRow("Faint Revives", "revives", 1);
                drawStatRow("Potions Drunk", "potionsDrunk", 2);
                drawStatRow("Heavy Throws", "throws", 3);

                ctx.fillStyle = '#64748b';
                ctx.font = 'italic 11px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText("Release TAB to close leaderboard", sx + sw/2, sy + sh - 20);
                ctx.restore();
            }
        });

        window.addEventListener('resize', () => {
            config.width = window.innerWidth;
            config.height = window.innerHeight;
            render.options.width = window.innerWidth;
            render.options.height = window.innerHeight;
        });


    </script>
</body>
</html>
