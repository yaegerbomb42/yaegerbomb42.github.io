<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HypeApp Web — Creator Video Feed</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #000; color: #fff; overflow-x: hidden; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .mobile-frame {
      box-shadow: 0 25px 60px -15px rgba(255, 75, 75, 0.25), 0 0 0 12px #18181b, 0 0 0 14px #27272a;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 md:p-6 bg-gradient-to-b from-zinc-950 via-black to-zinc-950">

  <!-- Header -->
  <header class="w-full max-w-4xl flex items-center justify-between mb-4">
    <div class="flex items-center gap-3">
      <a href="../" class="px-3 py-1.5 rounded-xl bg-zinc-900 border border-zinc-800 text-xs font-bold text-zinc-300 hover:text-white transition mono">
        ← Hub
      </a>
      <div class="flex items-center gap-2">
        <span class="text-xl">🔥</span>
        <h1 class="text-lg font-black tracking-tight text-white">HYPEAPP</h1>
        <span class="text-[10px] mono bg-rose-500/20 text-rose-300 px-2 py-0.5 rounded-full border border-rose-500/40 font-semibold">Web Edition</span>
      </div>
    </div>
    <div class="text-xs text-zinc-400 mono">
      Fast Express Backend Ready
    </div>
  </header>

  <!-- Centered Interactive Mobile Phone Frame -->
  <div class="relative w-full max-w-[380px] h-[720px] bg-black rounded-[46px] mobile-frame overflow-hidden flex flex-col my-auto border border-zinc-800">

    <!-- Top Dynamic Island / Speaker Notch -->
    <div class="absolute top-3 left-1/2 -translate-x-1/2 w-28 h-6 bg-zinc-900 rounded-full flex items-center justify-center z-50">
      <div class="w-2.5 h-2.5 rounded-full bg-zinc-800 mr-2"></div>
      <div class="w-3 h-3 rounded-full bg-indigo-950 border border-indigo-500/40"></div>
    </div>

    <!-- Video Feed Container -->
    <div class="relative flex-1 bg-zinc-900 flex items-center justify-center overflow-hidden">
      <!-- Simulated High Energy Video Canvas Background -->
      <div id="video-bg" class="absolute inset-0 bg-gradient-to-tr from-rose-950 via-zinc-900 to-indigo-950 flex flex-col items-center justify-center p-6 text-center transition-all duration-500">
        <div id="feed-icon" class="text-6xl mb-4 animate-bounce">⚡</div>
        <h2 id="feed-title" class="text-2xl font-black text-white tracking-tight mb-2">EPIC DRONE CHASE</h2>
        <p id="feed-author" class="text-xs text-rose-400 mono font-bold">@aerofpv · Trending #1</p>
      </div>

      <!-- Action Buttons Right Sidebar -->
      <div class="absolute right-3 bottom-24 flex flex-col items-center gap-4 z-40">
        <button id="btn-like" class="w-12 h-12 rounded-full bg-black/40 backdrop-blur-md border border-white/10 flex flex-col items-center justify-center active:scale-90 transition">
          <span class="text-xl">❤️</span>
          <span id="like-count" class="text-[10px] font-bold text-white mono">12.4K</span>
        </button>
        <button class="w-12 h-12 rounded-full bg-black/40 backdrop-blur-md border border-white/10 flex flex-col items-center justify-center active:scale-90 transition">
          <span class="text-xl">💬</span>
          <span class="text-[10px] font-bold text-white mono">482</span>
        </button>
        <button id="btn-next" class="w-12 h-12 rounded-full bg-rose-600 hover:bg-rose-500 text-white flex flex-col items-center justify-center shadow-lg active:scale-90 transition">
          <span class="text-xl">⬇️</span>
          <span class="text-[9px] font-bold uppercase mono">Next</span>
        </button>
      </div>

      <!-- Video Description Bottom Overlay -->
      <div class="absolute bottom-4 left-4 right-16 z-30">
        <div class="flex items-center gap-2 mb-1.5">
          <div class="w-7 h-7 rounded-full bg-gradient-to-r from-rose-500 to-amber-500"></div>
          <span class="text-xs font-bold text-white">CyberVibes</span>
          <button class="text-[10px] font-bold bg-white text-black px-2 py-0.5 rounded-full">Follow</button>
        </div>
        <p class="text-xs text-zinc-300 line-clamp-2 leading-relaxed">
          High speed cinematic fpv dive through downtown neon district. Pure adrenaline! 🔥🚀
        </p>
      </div>
    </div>

    <!-- Bottom Tab Bar -->
    <div class="h-16 bg-black border-t border-zinc-800 flex items-center justify-around px-2 z-50">
      <button class="flex flex-col items-center text-rose-500 text-xs font-bold">
        <span>🏠</span>
        <span class="text-[10px]">Feed</span>
      </button>
      <button class="flex flex-col items-center text-zinc-500 hover:text-white text-xs">
        <span>🔍</span>
        <span class="text-[10px]">Discover</span>
      </button>
      <button class="w-10 h-7 rounded-lg bg-gradient-to-r from-rose-500 to-purple-600 flex items-center justify-center text-white font-bold text-lg shadow-md active:scale-90 transition">
        +
      </button>
      <button class="flex flex-col items-center text-zinc-500 hover:text-white text-xs">
        <span>⚡</span>
        <span class="text-[10px]">Hype</span>
      </button>
      <button class="flex flex-col items-center text-zinc-500 hover:text-white text-xs">
        <span>👤</span>
        <span class="text-[10px]">Profile</span>
      </button>
    </div>

  </div>

  <footer class="mt-4 text-xs text-zinc-500 mono">
    HypeApp Mobile Prototype · Converted for Web Preview
  </footer>

  <script>
    const clips = [
      { title: "EPIC DRONE CHASE", author: "@aerofpv · Trending #1", icon: "⚡", bg: "from-rose-950 via-zinc-900 to-indigo-950", likes: 12400 },
      { title: "NEON DRIFT TOKYO", author: "@nightrunners · Trending #2", icon: "🏎️", bg: "from-indigo-950 via-zinc-900 to-purple-950", likes: 18900 },
      { title: "PARKOUR ROOFTOPS", author: "@urbanleap · Trending #3", icon: "🏃", bg: "from-emerald-950 via-zinc-900 to-cyan-950", likes: 8200 },
      { title: "BASS DROP LIVE", author: "@ravefrequency · Live", icon: "🎧", bg: "from-amber-950 via-zinc-900 to-rose-950", likes: 24100 }
    ];

    let current = 0;
    const feedBg = document.getElementById('video-bg');
    const feedIcon = document.getElementById('feed-icon');
    const feedTitle = document.getElementById('feed-title');
    const feedAuthor = document.getElementById('feed-author');
    const likeCount = document.getElementById('like-count');
    const btnNext = document.getElementById('btn-next');
    const btnLike = document.getElementById('btn-like');

    function updateFeed() {
      const c = clips[current];
      feedBg.className = `absolute inset-0 bg-gradient-to-tr ${c.bg} flex flex-col items-center justify-center p-6 text-center transition-all duration-500`;
      feedIcon.textContent = c.icon;
      feedTitle.textContent = c.title;
      feedAuthor.textContent = c.author;
      likeCount.textContent = (c.likes / 1000).toFixed(1) + 'K';
    }

    btnNext.addEventListener('click', () => {
      current = (current + 1) % clips.length;
      updateFeed();
    });

    btnLike.addEventListener('click', () => {
      clips[current].likes++;
      likeCount.textContent = (clips[current].likes / 1000).toFixed(1) + 'K';
      btnLike.classList.add('scale-125');
      setTimeout(() => btnLike.classList.remove('scale-125'), 150);
    });
  </script>
</body>
</html>
