<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <filter id="glow-brew" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="grad-ring-brew" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="50%" stop-color="#ff9900" />
      <stop offset="100%" stop-color="#ff2e93" />
    </linearGradient>
    <linearGradient id="grad-beer" x1="20" y1="22" x2="44" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffb703" />
      <stop offset="100%" stop-color="#fb8500" />
    </linearGradient>
  </defs>
  
  <!-- Outer Cyber Ring -->
  <circle cx="32" cy="32" r="29" stroke="url(#grad-ring-brew)" stroke-width="1.8" stroke-dasharray="8 3" opacity="0.85" filter="url(#glow-brew)" />
  <circle cx="32" cy="32" r="25.5" stroke="#00e5ff" stroke-width="0.7" opacity="0.4" />
  
  <!-- Mug Body -->
  <path d="M21 24 H41 V45 C41 48.3 38.3 51 35 51 H27 C23.7 51 21 48.3 21 45 Z" fill="url(#grad-beer)" opacity="0.9" />
  
  <!-- Beer Lines -->
  <line x1="26" y1="28" x2="26" y2="46" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />
  <line x1="31" y1="28" x2="31" y2="47" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />
  <line x1="36" y1="28" x2="36" y2="45" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />

  <!-- Mug Handle -->
  <path d="M41 27 H45.5 C48 27 50 29 50 31.5 V39.5 C50 42 48 44 45.5 44 H41" stroke="#ffb703" stroke-width="2.6" stroke-linecap="round" fill="none" />

  <!-- Foam Top -->
  <path d="M19 23 C19 20 22 18.5 24 20 C25.5 17.5 29.5 17 31.5 19 C33.5 17 37.5 17.5 39 19.5 C41 18.5 43.5 20.5 43 23 Z" fill="#ffffff" filter="url(#glow-brew)" />
</svg>
