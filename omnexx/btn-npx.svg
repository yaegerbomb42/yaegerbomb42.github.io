<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <filter id="glow-npx" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="grad-ring-npx" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#39ff14" />
    </linearGradient>
  </defs>

  <!-- Outer Cyber Ring -->
  <circle cx="32" cy="32" r="29" stroke="url(#grad-ring-npx)" stroke-width="1.8" stroke-dasharray="10 2" opacity="0.85" filter="url(#glow-npx)" />
  <circle cx="32" cy="32" r="25.5" stroke="#00e5ff" stroke-width="0.7" opacity="0.4" />

  <!-- Badge Plate -->
  <rect x="17" y="23" width="30" height="18" rx="4" fill="rgba(7, 13, 30, 0.85)" stroke="#00e5ff" stroke-width="1.2" />
  
  <!-- NPX Monogram & Bolt -->
  <!-- "NP" -->
  <path d="M21 27 H24 V37 H22 V31 H21 Z" fill="#00e5ff" />
  <path d="M25 27 H29 V34 H27 V37 H25 Z M27 29 V32 H28 V29 Z" fill="#00e5ff" />
  
  <!-- "X" Accent Bolt -->
  <path d="M32 27 L36 33 M36 27 L32 33" stroke="#39ff14" stroke-width="2.2" stroke-linecap="round" filter="url(#glow-npx)" />
  
  <!-- Execution Flash / Lightning -->
  <path d="M39 25 L43 29 L40 30 L44 35 L39 31 L41 30 Z" fill="#39ff14" filter="url(#glow-npx)" />
</svg>
