<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OMNEXX — Autonomous Agent Core</title>
<meta name="description" content="OMNEXX: long-running autonomous agent. Neo-cybernetic coordination plane, dark terminal, glassmorphic substrate.">
<meta name="theme-color" content="#030712">
<meta name="color-scheme" content="dark">
<link rel="canonical" href="https://omnexx.org/">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:url" content="https://omnexx.org/">
<meta property="og:image" content="https://omnexx.org/logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --bg-deep: #030712;
  --bg-void: #070d1e;
  
  /* Palette cores & glows */
  --neon-cyan-core: #00e5ff;
  --neon-cyan-glow: #0077fe;
  --neon-cyan-ambient: rgba(0, 229, 255, 0.16);
  
  --neon-pink-core: #ff2e93;
  --neon-pink-glow: #b000ff;
  --neon-pink-ambient: rgba(255, 46, 147, 0.16);
  
  --neon-green-core: #39ff14;
  --neon-green-alt: #00ff66;
  --neon-green-ambient: rgba(57, 255, 20, 0.16);
  
  --glass-bg: rgba(7, 13, 30, 0.65);
  --glass-border: rgba(0, 229, 255, 0.22);
  --glass-inner-bevel: inset 0 1px 1px rgba(255, 255, 255, 0.15), inset 0 -1px 1px rgba(0, 0, 0, 0.6);
  
  --text-primary: #f0f4fc;
  --text-muted: #8592ab;
  --text-dim: #455068;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  background-color: var(--bg-deep);
  background-image: 
    radial-gradient(ellipse 90% 70% at 50% -20%, rgba(0, 119, 254, 0.18), transparent 70%),
    radial-gradient(ellipse 70% 50% at 85% 100%, rgba(255, 46, 147, 0.12), transparent 70%),
    radial-gradient(ellipse 60% 50% at 15% 90%, rgba(57, 255, 20, 0.08), transparent 60%),
    linear-gradient(to bottom, #070d1e 0%, #030712 100%);
  color: var(--text-primary);
  font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  min-height: 100dvh;
  padding: 24px;
  position: relative;
}

/* Perspective Grid Plane */
.grid-bg {
  position: fixed;
  inset: -10%;
  background-image: 
    linear-gradient(to right, rgba(0, 180, 255, 0.13) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(0, 180, 255, 0.13) 1px, transparent 1px);
  background-size: 44px 44px;
  mask-image: radial-gradient(circle at 50% 50%, rgba(0,0,0,0.85) 20%, rgba(0,0,0,0) 80%);
  -webkit-mask-image: radial-gradient(circle at 50% 50%, rgba(0,0,0,0.85) 20%, rgba(0,0,0,0) 80%);
  pointer-events: none;
  z-index: 0;
  animation: gridDrift 40s linear infinite;
}

@keyframes gridDrift {
  0% { transform: translateY(0); }
  100% { transform: translateY(44px); }
}

/* Background Cyber Circuit SVG */
.circuit-traces {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
  overflow: hidden;
}

.circuit-path {
  fill: none;
  stroke-width: 2;
  opacity: 0.38;
}

.circuit-cyan {
  stroke: var(--neon-cyan-core);
  filter: drop-shadow(0 0 6px rgba(0, 229, 255, 0.7));
}

.circuit-pink {
  stroke: var(--neon-pink-core);
  filter: drop-shadow(0 0 6px rgba(255, 46, 147, 0.7));
}

.circuit-green {
  stroke: var(--neon-green-core);
  filter: drop-shadow(0 0 6px rgba(57, 255, 20, 0.7));
}

.circuit-pulse {
  stroke-dasharray: 12 180;
  animation: pulseTravel 6s linear infinite;
  stroke-width: 2.8;
  opacity: 0.9;
}

@keyframes pulseTravel {
  0% { stroke-dashoffset: 400; }
  100% { stroke-dashoffset: 0; }
}

/* Glassmorphic Neoism Main Window */
.window {
  width: 100%;
  max-width: 1040px;
  min-height: 560px;
  position: relative;
  z-index: 2;
  background: var(--glass-bg);
  backdrop-filter: blur(28px) saturate(180%);
  -webkit-backdrop-filter: blur(28px) saturate(180%);
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  box-shadow: 
    var(--glass-inner-bevel),
    0 24px 64px -16px rgba(0, 0, 0, 0.85),
    0 0 40px -10px rgba(0, 229, 255, 0.22),
    0 0 90px -25px rgba(255, 46, 147, 0.15);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: border-color 0.4s ease, box-shadow 0.4s ease;
}

.window:hover {
  border-color: rgba(0, 229, 255, 0.4);
  box-shadow: 
    var(--glass-inner-bevel),
    0 30px 72px -16px rgba(0, 0, 0, 0.9),
    0 0 50px -6px rgba(0, 229, 255, 0.32),
    0 0 100px -20px rgba(57, 255, 20, 0.18);
}

/* Titlebar */
.titlebar {
  height: 46px;
  background: rgba(4, 9, 22, 0.75);
  border-bottom: 1px solid rgba(0, 229, 255, 0.16);
  display: flex;
  align-items: center;
  position: relative;
  padding: 0 20px;
  user-select: none;
}

.window-pills {
  display: flex;
  align-items: center;
  gap: 9px;
  z-index: 2;
}

.pill-dot {
  width: 11px;
  height: 11px;
  border-radius: 50%;
  display: inline-block;
  transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.pill-dot:hover {
  transform: scale(1.25);
}

.dot-red {
  background: #ff4965;
  box-shadow: 0 0 8px rgba(255, 73, 101, 0.6);
}

.dot-yellow {
  background: #ffc83b;
  box-shadow: 0 0 8px rgba(255, 200, 59, 0.6);
}

.dot-green {
  background: var(--neon-green-core);
  box-shadow: 0 0 8px rgba(57, 255, 20, 0.6);
}

.title-badge {
  position: absolute;
  left: 0;
  right: 0;
  text-align: center;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  color: var(--text-muted);
  font-family: 'Rajdhani', sans-serif;
  font-weight: 600;
  font-size: 14px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  pointer-events: none;
}

.title-badge-icon {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  object-fit: contain;
  filter: drop-shadow(0 0 6px rgba(0, 229, 255, 0.55));
}

.title-badge .status-led {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--neon-cyan-core);
  box-shadow: 0 0 6px var(--neon-cyan-core);
  animation: pulseLed 2s ease-in-out infinite;
}

@keyframes pulseLed {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 1; }
}

/* Terminal Interior */
.terminal-content {
  flex: 1;
  padding: 56px 52px;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  position: relative;
}

/* Neoism Logo Header */
.logo-container {
  display: inline-flex;
  align-items: center;
  gap: 20px;
  margin-bottom: 34px;
  user-select: none;
}

.omnexx-hero-icon {
  width: clamp(54px, 8vw, 84px);
  height: clamp(54px, 8vw, 84px);
  object-fit: contain;
  filter: drop-shadow(0 0 16px rgba(0, 229, 255, 0.6)) drop-shadow(0 0 32px rgba(176, 0, 255, 0.4));
  animation: slowSpin 30s linear infinite;
  transition: transform 0.4s ease, filter 0.4s ease;
}

.logo-container:hover .omnexx-hero-icon {
  filter: drop-shadow(0 0 24px rgba(0, 229, 255, 0.85)) drop-shadow(0 0 45px rgba(255, 46, 147, 0.6));
  transform: scale(1.05);
}

@keyframes slowSpin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.logo-display {
  font-family: 'Orbitron', 'Montserrat', sans-serif;
  font-size: clamp(44px, 7.5vw, 76px);
  font-weight: 900;
  letter-spacing: 0.08em;
  display: inline-flex;
  align-items: center;
  line-height: 1.05;
}

/* Hollow/Outlined Neon Tubing Styles */
.neon-segment {
  display: inline-block;
  color: #ffffff;
  fill: transparent;
  transition: filter 0.3s ease;
}

/* Cyan Segment: OM */
.neon-cyan {
  -webkit-text-stroke: 1.8px #ebf9ff;
  text-shadow:
    0 0 3px #ffffff,
    0 0 8px #00e5ff,
    0 0 20px #00b0ff,
    0 0 42px #0077fe,
    0 0 70px rgba(0, 119, 254, 0.45);
}

/* Magenta Segment: NE (with geometric Triple Bar Ξ styling) */
.neon-pink {
  -webkit-text-stroke: 1.8px #ffebf5;
  text-shadow:
    0 0 3px #ffffff,
    0 0 8px #ff2e93,
    0 0 22px #e0009d,
    0 0 46px #b000ff,
    0 0 75px rgba(176, 0, 255, 0.45);
}

/* Electric Lime Segment: XX */
.neon-green {
  -webkit-text-stroke: 1.8px #f1ffeb;
  text-shadow:
    0 0 3px #ffffff,
    0 0 8px #39ff14,
    0 0 20px #00ff66,
    0 0 44px #00e65b,
    0 0 70px rgba(0, 255, 102, 0.45);
}

.logo-display:hover .neon-cyan {
  text-shadow:
    0 0 4px #ffffff,
    0 0 12px #00e5ff,
    0 0 28px #00b0ff,
    0 0 55px #0077fe,
    0 0 90px rgba(0, 119, 254, 0.7);
}

.logo-display:hover .neon-pink {
  text-shadow:
    0 0 4px #ffffff,
    0 0 12px #ff2e93,
    0 0 30px #e0009d,
    0 0 60px #b000ff,
    0 0 95px rgba(176, 0, 255, 0.7);
}

.logo-display:hover .neon-green {
  text-shadow:
    0 0 4px #ffffff,
    0 0 12px #39ff14,
    0 0 28px #00ff66,
    0 0 58px #00e65b,
    0 0 90px rgba(0, 255, 102, 0.7);
}

/* Prompt Line */
.prompt-line {
  display: flex;
  align-items: center;
  gap: 16px;
  font-size: clamp(20px, 3vw, 26px);
  margin-bottom: 28px;
}

.prompt-symbol {
  color: var(--neon-cyan-core);
  text-shadow: 0 0 8px var(--neon-cyan-core);
  font-weight: 700;
}

.prompt-cmd {
  color: #ffffff;
  font-weight: 500;
  letter-spacing: 0.04em;
}

.cursor {
  display: inline-block;
  width: 16px;
  height: 28px;
  background: repeating-linear-gradient(
    to bottom,
    var(--neon-green-core) 0px,
    var(--neon-green-core) 3px,
    #02040a 3px,
    #02040a 4px
  );
  box-shadow: 0 0 10px rgba(57, 255, 20, 0.85);
  animation: blink 1.05s steps(2, start) infinite;
}

/* Info lines */
.info-line {
  font-size: clamp(15px, 2.1vw, 20px);
  line-height: 1.8;
  margin-bottom: 6px;
  display: flex;
  align-items: baseline;
  gap: 12px;
}

.info-main {
  color: var(--text-primary);
  font-weight: 500;
}

.info-dim {
  color: var(--text-muted);
  font-weight: 400;
}

.prompt-char {
  color: var(--neon-pink-core);
  text-shadow: 0 0 6px rgba(255, 46, 147, 0.5);
  user-select: none;
  font-weight: 700;
}

.highlight-accent {
  color: var(--neon-cyan-core);
  font-weight: 600;
}

/* Install Methods Grid & Custom Buttons */
.install-methods-wrap {
  margin-top: 34px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  width: 100%;
}

.install-buttons-grid {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  width: 100%;
  max-width: 640px;
}

.install-method-btn {
  display: flex;
  align-items: center;
  gap: 9px;
  background: rgba(10, 18, 38, 0.7);
  border: 1px solid rgba(0, 229, 255, 0.25);
  border-radius: 10px;
  padding: 8px 14px;
  cursor: pointer;
  font-family: inherit;
  color: #e2e8f0;
  transition: all 0.22s ease;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
}

.install-method-btn:hover {
  border-color: var(--neon-cyan-core);
  box-shadow: 0 0 16px rgba(0, 229, 255, 0.4);
  transform: translateY(-2px);
  color: #ffffff;
}

.install-method-btn.active {
  border-color: var(--neon-cyan-core);
  background: rgba(0, 229, 255, 0.12);
  box-shadow: 0 0 18px rgba(0, 229, 255, 0.45);
}

.install-method-icon {
  width: 24px;
  height: 24px;
  flex-shrink: 0;
  object-fit: contain;
  filter: drop-shadow(0 0 4px rgba(0, 229, 255, 0.4));
}

.install-method-label {
  font-family: 'Rajdhani', sans-serif;
  font-weight: 700;
  font-size: 15px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.install-method-tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  padding: 2px 6px;
  border-radius: 4px;
  background: rgba(255, 255, 255, 0.08);
  color: var(--neon-cyan-core);
}

.post-install-note {
  margin-top: 4px;
  font-family: 'JetBrains Mono', monospace;
  font-size: clamp(12px, 1.4vw, 13.5px);
  color: rgba(255, 255, 255, 0.78);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
}

.post-install-note .prompt-char {
  color: var(--neon-green-core);
  font-weight: 700;
  text-shadow: 0 0 6px rgba(57, 255, 20, 0.6);
}

.post-install-note .neon-cmd {
  color: var(--neon-cyan-core);
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 4px;
  background: rgba(0, 229, 255, 0.12);
  border: 1px solid rgba(0, 229, 255, 0.3);
  text-shadow: 0 0 8px rgba(0, 229, 255, 0.6);
}

.vscode-btn {
  margin-top: 6px;
  display: inline-flex;
  align-items: center;
  gap: 9px;
  background: rgba(13, 24, 52, 0.75);
  border: 1px solid rgba(176, 0, 255, 0.4);
  border-radius: 9px;
  padding: 8px 16px;
  color: #c084fc;
  font-family: 'Rajdhani', sans-serif;
  font-weight: 600;
  font-size: 14px;
  letter-spacing: 0.04em;
  text-decoration: none;
  transition: all 0.22s ease;
  box-shadow: 0 0 12px rgba(176, 0, 255, 0.2);
}

.vscode-btn:hover {
  border-color: #d8b4fe;
  color: #ffffff;
  box-shadow: 0 0 20px rgba(176, 0, 255, 0.55);
  transform: translateY(-1px);
}

/* Glassmorphic Neoism CLI Box */
.install-box {
  margin-top: 8px;
  display: inline-flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  background: rgba(10, 18, 38, 0.65);
  border: 1px solid rgba(0, 229, 255, 0.35);
  border-radius: 12px;
  padding: 12px 16px 12px 22px;
  width: fit-content;
  max-width: 100%;
  box-shadow: 
    inset 0 1px 0 rgba(255, 255, 255, 0.12),
    0 10px 28px -6px rgba(0, 0, 0, 0.65),
    0 0 20px -4px rgba(0, 229, 255, 0.2);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  transition: all 0.25s ease;
}

.install-box:hover {
  border-color: var(--neon-cyan-core);
  box-shadow: 
    inset 0 1px 0 rgba(255, 255, 255, 0.18),
    0 12px 32px -6px rgba(0, 0, 0, 0.75),
    0 0 28px -2px rgba(0, 229, 255, 0.35);
}

.install-cmd {
  color: #ffffff;
  font-size: clamp(14px, 1.8vw, 17px);
  font-weight: 500;
  white-space: nowrap;
  overflow-x: auto;
  letter-spacing: 0.02em;
}

.install-cmd span {
  color: var(--neon-green-core);
  text-shadow: 0 0 5px rgba(57, 255, 20, 0.6);
  user-select: none;
  margin-right: 10px;
  font-weight: 700;
}

.copy-btn {
  background: rgba(13, 24, 48, 0.85);
  color: var(--neon-green-core);
  border: 1px solid rgba(57, 255, 20, 0.4);
  border-radius: 8px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.05em;
  padding: 8px 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  user-select: none;
  flex-shrink: 0;
  box-shadow: 0 0 10px rgba(57, 255, 20, 0.12);
}

.copy-btn:hover {
  background: rgba(57, 255, 20, 0.15);
  border-color: var(--neon-green-core);
  color: #ffffff;
  box-shadow: 0 0 16px rgba(57, 255, 20, 0.45);
  transform: translateY(-1px);
}

.copy-btn:active {
  transform: translateY(1px);
}

.copy-btn.copied {
  background: rgba(0, 229, 255, 0.2);
  border-color: var(--neon-cyan-core);
  color: #ffffff;
  box-shadow: 0 0 18px rgba(0, 229, 255, 0.5);
}

/* Ad Card */
.ad-card {
  margin-top: 32px;
  display: inline-flex;
  align-items: center;
  gap: 12px;
  background: rgba(0, 229, 255, 0.04);
  border: 1px solid rgba(0, 229, 255, 0.22);
  border-left: 3px solid var(--neon-cyan-core);
  border-radius: 8px;
  padding: 10px 18px;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  box-shadow: 0 4px 20px -4px rgba(0, 0, 0, 0.5), 0 0 16px -4px rgba(0, 229, 255, 0.15);
  max-width: 100%;
}

.ad-card-badge {
  font-family: 'Rajdhani', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--neon-cyan-core);
  background: rgba(0, 229, 255, 0.12);
  padding: 2px 7px;
  border-radius: 4px;
  white-space: nowrap;
}

.ad-card-text {
  font-size: clamp(13px, 1.6vw, 15px);
  color: #d8e4f5;
  font-weight: 400;
  letter-spacing: 0.01em;
}

.ad-card-text strong {
  color: #ffffff;
  font-weight: 600;
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}

@media (max-width: 640px) {
  body {
    padding: 12px;
  }
  .terminal-content {
    padding: 36px 20px;
  }
  .window {
    min-height: 440px;
    border-radius: 12px;
  }
  .logo-container {
    margin-bottom: 24px;
  }
  .prompt-line {
    margin-bottom: 22px;
  }
  .cursor {
    width: 13px;
    height: 24px;
  }
  .install-box {
    margin-top: 30px;
    flex-direction: column;
    align-items: stretch;
    padding: 14px;
    width: 100%;
  }
  .copy-btn {
    justify-content: center;
    padding: 10px;
  }
}
</style>
</head>
<body>

<!-- Ambient Grid Background -->
<div class="grid-bg"></div>

<!-- Cyber Circuit & Bus Vector Lines -->
<svg class="circuit-traces" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="none">
  <defs>
    <linearGradient id="grad-cyan-pink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff2e93" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="grad-pink-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2e93" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#39ff14" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Circuit Trace 1: Cyan Top Bus -->
  <path class="circuit-path circuit-cyan" d="M -50 210 L 280 210 Q 340 210 340 270 L 340 430 Q 340 490 400 490 L 1650 490" />
  <path class="circuit-path circuit-cyan circuit-pulse" d="M -50 210 L 280 210 Q 340 210 340 270 L 340 430 Q 340 490 400 490 L 1650 490" />

  <!-- Circuit Trace 2: Pink Mid Bus -->
  <path class="circuit-path circuit-pink" d="M -50 420 L 520 420 Q 580 420 580 360 L 580 240 Q 580 180 640 180 L 1650 180" />

<script>
(function() {
  var installCmd = document.getElementById('install-cmd');
  var copyBtn = document.getElementById('copy-btn');
  var copyLabel = document.getElementById('copy-text');
  var methodBtns = document.querySelectorAll('.install-method-btn');
  var currentCmd = 'brew install yaegerbomb42/omnexx/omnexx';
  var timer;

  function performCopy(textToCopy, triggerBtn) {
    function success() {
      if (triggerBtn && triggerBtn !== copyBtn) {
        var tag = triggerBtn.querySelector('.install-method-tag');
        if (tag) {
          var originalText = tag.getAttribute('data-orig') || tag.textContent;
          tag.setAttribute('data-orig', originalText);
          tag.textContent = 'COPIED!';
          setTimeout(function() {
            tag.textContent = originalText;
          }, 1500);
        }
      }
      copyBtn.classList.add('copied');
      copyLabel.textContent = 'copied!';
      clearTimeout(timer);
      timer = setTimeout(function() {
        copyBtn.classList.remove('copied');
        copyLabel.textContent = 'copy';
      }, 1800);
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(textToCopy).then(success, fallback);
    } else {
      fallback();
    }

    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = textToCopy;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        if (document.execCommand('copy')) {
          success();
        }
      } catch(e) {}
      document.body.removeChild(ta);
    }
  }

  methodBtns.forEach(function(btn) {
    btn.addEventListener('click', function() {
      methodBtns.forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      currentCmd = btn.getAttribute('data-cmd');
      installCmd.innerHTML = '<span>$</span>' + currentCmd;
      performCopy(currentCmd, btn);
    });
  });

  copyBtn.addEventListener('click', function() {
    performCopy(currentCmd, copyBtn);
  });
})();
</script>
