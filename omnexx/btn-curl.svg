<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <filter id="glow-curl" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="grad-ring-curl" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#39ff14" />
    </linearGradient>
  </defs>
  
  <!-- Outer Cyber Ring -->
  <circle cx="32" cy="32" r="29" stroke="url(#grad-ring-curl)" stroke-width="1.8" stroke-dasharray="6 3 2 3" opacity="0.85" filter="url(#glow-curl)" />
  <circle cx="32" cy="32" r="25.5" stroke="#39ff14" stroke-width="0.7" opacity="0.4" />

  <!-- Terminal Bracket Symbols -->
  <path d="M19 25 L15 32 L19 39" stroke="#00e5ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M45 25 L49 32 L45 39" stroke="#00e5ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Curved Transfer Arrow / Flow -->
  <path d="M25 28 C28 22 36 22 39 27" stroke="#39ff14" stroke-width="2.5" stroke-linecap="round" fill="none" filter="url(#glow-curl)" />
  <polygon points="38,24 42,28 37,30" fill="#39ff14" />

  <path d="M39 36 C36 42 28 42 25 37" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round" fill="none" filter="url(#glow-curl)" />
  <polygon points="26,40 22,36 27,34" fill="#00e5ff" />
  
  <!-- Core Data Orb -->
  <circle cx="32" cy="32" r="3" fill="#ffffff" filter="url(#glow-curl)" />
</svg>
