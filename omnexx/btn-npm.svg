<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <filter id="glow-npm" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="grad-ring-npm" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff2e93" />
      <stop offset="100%" stop-color="#cb3837" />
    </linearGradient>
  </defs>

  <!-- Outer Cyber Ring -->
  <circle cx="32" cy="32" r="29" stroke="url(#grad-ring-npm)" stroke-width="1.8" stroke-dasharray="7 4" opacity="0.85" filter="url(#glow-npm)" />
  <circle cx="32" cy="32" r="25.5" stroke="#ff2e93" stroke-width="0.7" opacity="0.4" />

  <!-- NPM Red/Neon Block Background -->
  <rect x="18" y="22" width="28" height="20" rx="3" fill="#cb3837" opacity="0.9" />
  <rect x="18" y="22" width="28" height="20" rx="3" stroke="#ff2e93" stroke-width="1.2" fill="none" filter="url(#glow-npm)" />

  <!-- NPM Letterforms (White cutouts) -->
  <path d="M22 26 H26 V38 H24 V30 H22 Z" fill="#ffffff" />
  <path d="M28 26 H34 V38 H32 V36 H30 V38 H28 Z M30 29 V33 H32 V29 Z" fill="#ffffff" />
  <path d="M36 26 H42 V34 H38 V38 H36 Z M38 29 V31 H40 V29 Z" fill="#ffffff" />
</svg>
