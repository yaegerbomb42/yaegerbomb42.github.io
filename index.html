<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>yaeger's</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030408;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    .viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background-color: #030408;
    }

    /* Fixed Aspect Ratio Stage matching 1024x571 reference image */
    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 179.33vh; /* 1024 / 571 = ~1.7933 */
      max-height: 55.76vw; /* 571 / 1024 = ~0.5576 */
      aspect-ratio: 1024 / 571;
      margin: auto;
    }

    .hero-art {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    /* Ambient particles canvas */
    #ambient-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      mix-blend-mode: screen;
      opacity: 0.85;
      z-index: 5;
    }

    /* Full-Half Interactive Click Zones */
    .half-zone {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 50%;
      text-decoration: none;
      cursor: pointer;
      outline: none;
      z-index: 10;
      display: block;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Left Half: OMNEXX */
    .zone-left {
      left: 0;
    }

    /* Right Half: DWEEBS */
    .zone-right {
      right: 0;
    }

    /* Glow overlays for each half */
    .half-glow {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .zone-left .half-glow {
      background: radial-gradient(circle at 30% 50%, rgba(0, 240, 255, 0.22) 0%, rgba(0, 119, 254, 0.12) 45%, transparent 75%);
      box-shadow: inset 10px 0 50px rgba(0, 240, 255, 0.25);
    }

    .zone-right .half-glow {
      background: radial-gradient(circle at 70% 50%, rgba(255, 0, 119, 0.22) 0%, rgba(255, 221, 0, 0.12) 45%, transparent 75%);
      box-shadow: inset -10px 0 50px rgba(255, 0, 119, 0.25);
    }

    /* Subtle active/hover beam line indicator */
    .portal-beam {
      position: absolute;
      top: 15%;
      bottom: 12%;
      width: 32%;
      border-radius: 28px;
      opacity: 0;
      transform: scale(0.96);
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    .zone-left .portal-beam {
      left: 8%;
      border: 2px solid rgba(0, 240, 255, 0.7);
      box-shadow: 0 0 50px rgba(0, 240, 255, 0.6), inset 0 0 40px rgba(0, 240, 255, 0.3);
    }

    .zone-right .portal-beam {
      right: 8%;
      border: 2px solid rgba(255, 0, 119, 0.7);
      box-shadow: 0 0 55px rgba(255, 0, 119, 0.65), 0 0 35px rgba(255, 221, 0, 0.4), inset 0 0 40px rgba(255, 0, 119, 0.3);
    }

    /* Hover & Focus states */
    .zone-left:hover .half-glow,
    .zone-left:focus .half-glow {
      opacity: 1;
    }
    .zone-left:hover .portal-beam,
    .zone-left:focus .portal-beam {
      opacity: 1;
      transform: scale(1.01);
    }

    .zone-right:hover .half-glow,
    .zone-right:focus .half-glow {
      opacity: 1;
    }
    .zone-right:hover .portal-beam,
    .zone-right:focus .portal-beam {
      opacity: 1;
      transform: scale(1.01);
    }

    /* Hotkey helper pill */
    .hotkey-bar {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 12, 18, 0.75);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      padding: 6px 18px;
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: 11px;
      color: #94a3b8;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.5px;
      z-index: 20;
      pointer-events: none;
    }

    .hotkey-bar kbd {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .hotkey-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>
  <div class="viewport">
    <div class="stage">
      <!-- Reference Scene Image -->
      <img
        src="yaeger-portal-hero.jpg"
        alt="Yaeger's Portal - Omnexx and Dweebs"
        class="hero-art"
        loading="eager"
      />

      <!-- Floating Neon Particles -->
      <canvas id="ambient-canvas"></canvas>

      <!-- Left Half: Clickable Omnexx Zone -->
      <a href="./omnexx/" class="half-zone zone-left" aria-label="Enter Omnexx (Left Side)">
        <div class="half-glow"></div>
        <div class="portal-beam"></div>
      </a>

      <!-- Right Half: Clickable Dweebs & Games Zone -->
      <a href="./game/" class="half-zone zone-right" aria-label="Play Dweebs and Games (Right Side)">
        <div class="half-glow"></div>
        <div class="portal-beam"></div>
      </a>
    </div>

    <!-- Hotkey Indicator -->
    <div class="hotkey-bar">
      <div class="hotkey-item">
        <kbd>1</kbd> <span>Omnexx (Left)</span>
      </div>
      <div class="hotkey-item">
        <kbd>2</kbd> <span>Dweebs (Right)</span>
      </div>
    </div>
  </div>

  <script>
    // Keyboard shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === '1' || e.key.toLowerCase() === 'o') {
        window.location.href = './omnexx/';
      }
      if (e.key === '2' || e.key.toLowerCase() === 'g' || e.key.toLowerCase() === 'd') {
        window.location.href = './game/';
      }
    });

    // Particle Canvas Animation
    const canvas = document.getElementById('ambient-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2.2 + 0.8;
        this.vx = (Math.random() - 0.5) * 0.4;
        this.vy = -Math.random() * 0.6 - 0.2;
        this.alpha = Math.random() * 0.6 + 0.2;
        // Cyan on left, magenta/yellow on right
        if (this.x < canvas.width * 0.5) {
          this.color = Math.random() > 0.3 ? '#00f0ff' : '#0077fe';
        } else {
          this.color = Math.random() > 0.4 ? '#ff0077' : '#ffdd00';
        }
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.y < 0 || this.x < 0 || this.x > canvas.width) {
          this.reset();
          this.y = canvas.height;
        }
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 8;
        ctx.shadowColor = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    const count = 45;
    for (let i = 0; i < count; i++) {
      particles.push(new Particle());
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let p of particles) {
        p.update();
        p.draw();
      }
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
  </script>
</body>
</html>
