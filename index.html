<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>yaeger's</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: rgba(22, 25, 35, 0.72);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-border-hover: rgba(255, 255, 255, 0.22);
      --text: #f3f4f6;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --accent-game: #ec4899;
      --accent-omnexx: #6366f1;
      --font-main: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(99, 102, 241, 0.18), transparent 70%),
        radial-gradient(ellipse 60% 40% at 85% 60%, rgba(236, 72, 153, 0.12), transparent 60%),
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: auto, auto, 48px 48px, 48px 48px;
    }

    .top-glow {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
    }

    header {
      padding: 64px 24px 32px;
      max-width: 960px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 16px;
    }

    .headline-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      width: 100%;
      max-width: 320px;
      filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.15));
      transition: transform 0.25s ease;
    }

    .headline-wrap:hover {
      transform: scale(1.02);
    }

    .headline-svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .subtitle {
      font-size: 15px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.2px;
    }

    main {
      flex: 1;
      max-width: 960px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 24px 72px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 24px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-decoration: none;
      color: inherit;
      position: relative;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(circle at 80% 20%, var(--glow, rgba(255, 255, 255, 0.08)), transparent 60%);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--card-border-hover);
      box-shadow: 0 16px 40px -12px rgba(0, 0, 0, 0.45);
    }

    .card:hover::before {
      opacity: 1;
    }

    .card-gamewithfam {
      --glow: rgba(236, 72, 153, 0.18);
    }

    .card-omnexx {
      --glow: rgba(99, 102, 241, 0.2);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .card-icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      transition: transform 0.2s ease;
    }

    .card:hover .card-icon {
      transform: scale(1.08);
    }

    .card-badge {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      color: var(--text-dim);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 4px 10px;
      border-radius: 999px;
      letter-spacing: 0.5px;
    }

    .card-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #ffffff;
      margin-bottom: 12px;
    }

    .card-desc {
      font-size: 15px;
      color: var(--text-muted);
      line-height: 1.6;
      font-weight: 400;
      margin-bottom: 28px;
    }

    .card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .card-action {
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: gap 0.2s ease, color 0.2s ease;
    }

    .card:hover .card-action {
      gap: 10px;
      color: #ffffff;
    }

    .card-arrow {
      font-size: 16px;
      line-height: 1;
      transition: transform 0.2s ease;
    }

    .card:hover .card-arrow {
      transform: translateX(3px);
    }

    footer {
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding: 24px;
      text-align: center;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-dim);
    }

    @media (max-width: 640px) {
      header {
        padding: 48px 20px 24px;
      }
      main {
        padding: 16px 20px 48px;
      }
      .card {
        padding: 24px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="top-glow"></div>

  <header>
    <div class="headline-wrap" title="yaeger's">
      <svg class="headline-svg" xmlns="http://www.w3.org/2000/svg" viewBox="-6 -6 254 42" role="img" aria-label="Yaeger">
        <defs><clipPath id="cap"><rect x="-10" y="0" width="270" height="30"></rect></clipPath></defs>
        <g clip-path="url(#cap)" fill="none" stroke="currentColor" stroke-width="3.5" stroke-miterlimit="10">
          <path d="M-0.2 -3 L16 14.5 L32.2 -3 M16 14.5 V33"></path>
          <path transform="translate(42 0)" d="M0.4 33 L16 3.8 L31.6 33"></path>
          <path transform="translate(84 0)" d="M1.75 0 V30 M0 1.75 H32 M0 15 H28 M0 28.25 H32"></path>
          <path transform="translate(126 0)" d="M32 1.75 H1.75 V28.25 H30.25 V15 H17"></path>
          <path transform="translate(168 0)" d="M1.75 0 V30 M0 1.75 H32 M0 15 H28 M0 28.25 H32"></path>
          <path transform="translate(210 0)" d="M1.75 30 V1.75 H30.25 V15 H1.75 M14 15 L31.3 32"></path>
        </g>
      </svg>
    </div>
    <p class="subtitle">Welcome to yaeger's place</p>
  </header>

  <main>
    <div class="grid">
      <!-- GameWithFam -->
      <a href="./game/" class="card card-gamewithfam">
        <div>
          <div class="card-top">
            <div class="card-icon">🎮</div>
            <span class="card-badge">Press 1</span>
          </div>
          <h2 class="card-title">GameWithFam</h2>
          <p class="card-desc">Party games and multiplayer arcade challenges designed to play together in real time.</p>
        </div>
        <div class="card-bottom">
          <span class="card-action">Play now <span class="card-arrow">→</span></span>
        </div>
      </a>

      <!-- Omnexx -->
      <a href="./omnexx/" class="card card-omnexx">
        <div>
          <div class="card-top">
            <div class="card-icon">🪐</div>
            <span class="card-badge">Press 2</span>
          </div>
          <h2 class="card-title">Omnexx</h2>
          <p class="card-desc">Interactive workspace, smart tooling, and collaborative agent platform.</p>
        </div>
        <div class="card-bottom">
          <span class="card-action">Explore <span class="card-arrow">→</span></span>
        </div>
      </a>
    </div>
  </main>

  <footer>
    yaeger's
  </footer>

  <script>
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === '1') window.location.href = './game/';
      if (e.key === '2' || e.key.toLowerCase() === 'o') window.location.href = './omnexx/';
    });
  </script>
</body>
</html>
