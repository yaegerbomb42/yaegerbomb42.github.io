<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MONOLITH</title>
  <style>
    :root {
      --bg: #090a0f;
      --fg: #e2e8f0;
      --accent: #38bdf8;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .badge {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 9999px;
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.25);
      margin-bottom: 24px;
    }
    h1 {
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #ffffff 30%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
    }
    p {
      font-size: 1.15rem;
      color: #94a3b8;
      max-width: 540px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      width: 100%;
      max-width: 680px;
      text-align: left;
    }
    .card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 18px 20px;
    }
    .card-label {
      font-family: var(--mono);
      font-size: 11px;
      color: #64748b;
      margin-bottom: 6px;
    }
    .card-val {
      font-size: 0.95rem;
      color: #f1f5f9;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="badge">Baseline Cleared &bull; Oracle VPS Online</div>
  <h1>MONOLITH</h1>
  <p>Scratch baseline initialized. Zero legacy debt, zero bloated harnesses, zero phantom games. Ready for direct value creation.</p>
  <div class="grid">
    <div class="card">
      <div class="card-label">HOST COMPUTE</div>
      <div class="card-val">Oracle VPS (147.224.158.118)</div>
    </div>
    <div class="card">
      <div class="card-label">EDGE CDN</div>
      <div class="card-val">GitHub Pages CDN</div>
    </div>
    <div class="card">
      <div class="card-label">AI REASONING</div>
      <div class="card-val">Direct LLM & 3D Pipelines</div>
    </div>
  </div>
</body>
</html>
