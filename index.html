<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>yaeger's</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --cyan-glow: #00f0ff;
      --pink-glow: #ff0077;
      --yellow-glow: #ffdd00;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030408;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    /* Fullscreen Viewport Wrapper */
    .viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background-color: #030408;
    }

    /* Fixed Aspect Ratio Stage matching 1024x571 image ratio */
    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 179.33vh; /* 1024 / 571 = ~1.7933 */
      max-height: 55.76vw; /* 571 / 1024 = ~0.5576 */
      aspect-ratio: 1024 / 571;
      margin: auto;
    }

    /* Background Artwork */
    .hero-art {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    /* Ambient particles & lighting canvas overlay */
    #ambient-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      mix-blend-mode: screen;
      opacity: 0.8;
    }

    /* Interactive Portals Overlay */
    .portal-hotspot {
      position: absolute;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 18px;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      outline: none;
      z-index: 10;
    }

    /* OMNEXX Portal Zone */
    .portal-omnexx {
      top: 20%;
      left: 7.5%;
      width: 25.5%;
      height: 62%;
    }

    .portal-omnexx .glow-frame {
      position: absolute;
      inset: -4px;
      border-radius: 20px;
      border: 2px solid rgba(0, 240, 255, 0.4);
      background: radial-gradient(circle at center, rgba(0, 240, 255, 0.12), transparent 70%);
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.3), inset 0 0 30px rgba(0, 240, 255, 0.2);
      opacity: 0;
      transition: all 0.35s ease;
      pointer-events: none;
    }

    .portal-omnexx:hover .glow-frame,
    .portal-omnexx:focus .glow-frame {
      opacity: 1;
      border-color: rgba(0, 240, 255, 0.9);
      box-shadow: 0 0 45px rgba(0, 240, 255, 0.7), inset 0 0 50px rgba(0, 240, 255, 0.4);
      transform: scale(1.02);
    }

    /* OMNEXX Enter Button Overlay */
    .btn-enter {
      position: absolute;
      bottom: 12.8%;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(180deg, #02b0e8 0%, #0066aa 100%);
      color: #ffffff;
      font-size: clamp(10px, 1.4vw, 15px);
      font-weight: 800;
      letter-spacing: 0.5px;
      padding: 6px 20px;
      border-radius: 999px;
      border: 2px solid #55e6ff;
      box-shadow: 0 0 16px rgba(0, 240, 255, 0.7), inset 0 1px 3px rgba(255,255,255,0.6);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.5);
    }

    .portal-omnexx:hover .btn-enter {
      transform: translateX(-50%) scale(1.1);
      box-shadow: 0 0 28px rgba(0, 240, 255, 1), inset 0 1px 4px rgba(255,255,255,0.9);
      background: linear-gradient(180deg, #1ce3ff 0%, #0088dd 100%);
    }

    /* DWEEBS / GAME Portal Zone */
    .portal-dweebs {
      top: 22%;
      right: 7.5%;
      width: 26%;
      height: 61%;
    }

    .portal-dweebs .glow-frame {
      position: absolute;
      inset: -4px;
      border-radius: 20px;
      border: 2px solid rgba(255, 0, 119, 0.4);
      background: radial-gradient(circle at center, rgba(255, 221, 0, 0.15), rgba(255, 0, 119, 0.1) 60%, transparent 80%);
      box-shadow: 0 0 25px rgba(255, 0, 119, 0.35), inset 0 0 30px rgba(255, 221, 0, 0.2);
      opacity: 0;
      transition: all 0.35s ease;
      pointer-events: none;
    }

    .portal-dweebs:hover .glow-frame,
    .portal-dweebs:focus .glow-frame {
      opacity: 1;
      border-color: rgba(255, 221, 0, 0.9);
      box-shadow: 0 0 50px rgba(255, 0, 119, 0.8), 0 0 30px rgba(255, 221, 0, 0.6), inset 0 0 45px rgba(255, 0, 119, 0.4);
      transform: scale(1.02);
    }

    /* DWEEBS Play Button Overlay */
    .btn-play {
      position: absolute;
      bottom: 12.8%;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(180deg, #ff1475 0%, #d80055 100%);
      color: #ffffff;
      font-size: clamp(10px, 1.4vw, 15px);
      font-weight: 800;
      letter-spacing: 0.5px;
      padding: 6px 22px;
      border-radius: 999px;
      border: 2px solid #ff77b3;
      box-shadow: 0 0 16px rgba(255, 0, 119, 0.8), inset 0 1px 3px rgba(255,255,255,0.7);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.5);
    }

    .portal-dweebs:hover .btn-play {
      transform: translateX(-50%) scale(1.1);
      box-shadow: 0 0 30px rgba(255, 0, 119, 1), 0 0 15px rgba(255, 221, 0, 0.8), inset 0 1px 4px rgba(255,255,255,0.9);
      background: linear-gradient(180deg, #ff388e 0%, #ee0060 100%);
    }

    /* Hotkey helper pill in the center top */
    .hotkey-bar {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 12, 18, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      padding: 6px 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 11px;
      color: #94a3b8;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.5px;
      z-index: 20;
    }

    .hotkey-bar kbd {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .hotkey-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>
  <div class="viewport">
    <div class="stage">
      <!-- Main Scene Visual Artwork -->
      <img
        src="yaeger-portal-hero.jpg"
        alt="Yaeger's Portal - Omnexx and Dweebs"
        class="hero-art"
        loading="eager"
      />

      <!-- Atmospheric Neon Particle Canvas Overlay -->
      <canvas id="ambient-canvas"></canvas>

      <!-- 1. OMNEXX Portal Click Zone -->
      <a href="./omnexx/" class="portal-hotspot portal-omnexx" aria-label="Enter Omnexx">
        <div class="glow-frame"></div>
        <div class="btn-enter">
          <span>Enter</span>
        </div>
      </a>

      <!-- 2. DWEEBS / GAME Portal Click Zone -->
      <a href="./game/" class="portal-hotspot portal-dweebs" aria-label="Play Games and Dweebs">
        <div class="glow-frame"></div>
        <div class="btn-play">
          <span>Play</span>
        </div>
      </a>
    </div>

    <!-- Minimal Hotkey helper -->
    <div class="hotkey-bar">
      <div class="hotkey-item">
        <kbd>1</kbd> <span>Omnexx</span>
      </div>
      <div class="hotkey-item">
        <kbd>2</kbd> <span>Dweebs & Games</span>
      </div>
    </div>
  </div>

  <script>
    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === '1' || e.key.toLowerCase() === 'o') {
        window.location.href = './omnexx/';
      }
      if (e.key === '2' || e.key.toLowerCase() === 'g' || e.key.toLowerCase() === 'd') {
        window.location.href = './game/';
      }
    });

    // Particle Canvas Animation
    const canvas = document.getElementById('ambient-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 0.8;
        this.vx = (Math.random() - 0.5) * 0.4;
        this.vy = -Math.random() * 0.6 - 0.2;
        this.alpha = Math.random() * 0.6 + 0.2;
        this.color = Math.random() > 0.5 ? '#00f0ff' : (Math.random() > 0.5 ? '#ff0077' : '#ffdd00');
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.y < 0 || this.x < 0 || this.x > canvas.width) {
          this.reset();
          this.y = canvas.height;
        }
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 8;
        ctx.shadowColor = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    const count = 45;
    for (let i = 0; i < count; i++) {
      particles.push(new Particle());
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let p of particles) {
        p.update();
        p.draw();
      }
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
  </script>
</body>
</html>
