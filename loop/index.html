<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loop — yaeger</title>
  <link rel="icon" href="../info/favicon.svg" type="image/svg+xml" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .nav-bar {
      position: fixed; top: 0; left: 0; right: 0; height: 38px;
      background: rgba(10, 10, 15, 0.85); backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; z-index: 9999; font-size: 13px; color: #888;
    }
    .nav-left { display: flex; align-items: center; gap: 12px; }
    .back-btn {
      color: #a855f7; text-decoration: none; font-weight: 600;
      display: flex; align-items: center; gap: 6px; transition: opacity 0.2s;
    }
    .back-btn:hover { opacity: 0.8; }
    .app-title { color: #fff; font-weight: 600; letter-spacing: 0.5px; }
    .badge {
      font-size: 11px; background: rgba(168, 85, 247, 0.15); color: #a855f7;
      padding: 2px 8px; border-radius: 99px; border: 1px solid rgba(168, 85, 247, 0.3);
    }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #00ff88; box-shadow: 0 0 8px #00ff88; }
    .frame-container {
      position: absolute; top: 38px; bottom: 0; left: 0; right: 0; width: 100%; height: calc(100% - 38px);
    }
    iframe { width: 100%; height: 100%; border: none; background: #000; }
  </style>
</head>
<body>
  <div class="nav-bar">
    <div class="nav-left">
      <a href="../" class="back-btn">← Hub</a>
      <span class="app-title">Loop Knowledge & Video Graph</span>
      <a href="https://looper.icu/" target="_blank" rel="noopener" class="badge" style="text-decoration: none;">looper.icu ↗</a>
    </div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <div class="status-dot"></div>
      <span style="font-size: 12px; color: #aaa;">Live (HTTPS)</span>
    </div>
  </div>
  <div class="frame-container">
    <iframe src="https://looper.icu/" allow="clipboard-read; clipboard-write; camera; microphone" sandbox="allow-forms allow-modals allow-popups allow-presentation allow-same-origin allow-scripts"></iframe>
  </div>
</body>
</html>
