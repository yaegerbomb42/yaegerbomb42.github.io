<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UNIFIED // shred season</title>
<style>
:root{--ink:#ffe9ee;--hot:#ff2b4d;--neon:#19f0ff;--bg:#000;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--ink:#ffe9ee;--hot:#ff2b4d;--neon:#19f0ff;--bg:#000}}
:root[data-theme="dark"]{--ink:#ffe9ee;--bg:#000}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;color:var(--ink);font:12px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.14em;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);padding:16px 18px;display:flex;justify-content:space-between;gap:12px;pointer-events:none;text-transform:uppercase;z-index:10}
#hud b{font-size:26px;font-weight:600;color:var(--neon);text-shadow:0 0 12px var(--neon);letter-spacing:.04em}
#hud small{display:block;opacity:.55;font-size:10px}
#hud .r{text-align:right}
#bar{position:fixed;left:18px;right:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);height:3px;background:rgba(255,255,255,.12);z-index:10}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--neon),var(--hot));box-shadow:0 0 12px var(--hot)}
#voice{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 40px);text-align:center;padding:0 24px;font-size:14px;letter-spacing:.2em;text-transform:lowercase;color:#ffb3c1;text-shadow:0 0 14px var(--hot);min-height:1.5em;transition:opacity 1.2s;z-index:10}
#go{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;letter-spacing:.5em;text-transform:uppercase;background:rgba(0,0,0,.35);transition:opacity .8s;cursor:pointer;z-index:20}
#go span{border:1px solid var(--hot);padding:14px 22px;box-shadow:0 0 24px rgba(255,43,77,.5),inset 0 0 18px rgba(255,43,77,.3);animation:p 1.1s infinite alternate}
@keyframes p{to{box-shadow:0 0 50px rgba(255,43,77,.9),inset 0 0 30px rgba(255,43,77,.5)}}

/* Music Controls Toggle */
#musicToggle{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);z-index:30;background:rgba(0,0,0,0.6);border:1px solid var(--neon);color:var(--neon);font:10px monospace;padding:5px 10px;border-radius:4px;cursor:pointer;letter-spacing:0.1em;text-transform:uppercase;box-shadow:0 0 10px rgba(25,240,255,0.3);transition:all 0.2s}
#musicToggle:hover{background:var(--neon);color:#000;box-shadow:0 0 18px var(--neon)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
 <div>mile <b id="mi">0.00</b><small>of 5.00 · shred season</small></div>
 <div class="r">cadence <b id="sp">172</b><small>hr <span id="hr">148</span> · pace <span id="pc">5:03</span>/mi</small></div>
</div>
<div id="voice"></div>
<div id="bar"><i id="pr"></i></div>
<div id="go"><span>tap to ignite · hold to shred</span></div>
<button id="musicToggle">🔊 MUSIC ON</button>

<script src="./music.js"></script>
<script>
const FS=`precision highp float;
uniform vec2 R,M;uniform float T,D,B,S,P;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+1.),f.x),f.y);}
float fb(vec2 p){float a=.5,s=0.;for(int i=0;i<4;i++){s+=a*n(p);p=p*2.03+7.;a*=.5;}return s;}
vec3 scene(vec2 uv){
 vec2 c=vec2(M.x*.04,.04+M.y*.03),d=uv-c;float r=length(d),pr=.25+.012*B;
 vec2 bu=uv-d*.045/(r*r+.025);
 float bob=sin(P*6.2832)*.012*(1.+S);
 vec3 rd=normalize(vec3(bu.x+bob*.3,bu.y+bob,1.25-.35*S));
 float ty=1.7/(abs(rd.y)+1e-3),tx=3.2/(abs(rd.x)+1e-3);bool wl=tx<ty;float t=min(tx,ty);
 vec2 g=vec2(wl?rd.y:rd.x,rd.z)*t;g.y+=D;
 float gr=h(vec2(floor(g.y),floor(T*7.)));g.x+=step(.965-.05*S,gr)*(gr-.96)*30.;
 vec2 id=floor(g),f=fract(g);float e=min(min(f.x,1.-f.x),min(f.y,1.-f.y));
 float rid=h(id+floor(T*.6+h(id)*9.));
 vec3 col=vec3(.02,.025,.035)+.03*step(0.,sin(g.x*50.)*sin(g.y*50.));
 col+=smoothstep(.07,0.,e)*mix(vec3(.1,.9,1.),vec3(1.,.1,.5),.5+.5*sin(g.y*.15+T*.5))*(1.2+B);
 col+=step(rid,.05)*vec3(.8,.9,1.)*(.25+B*.7)*smoothstep(0.,.12,e);
 if(rid>.945-.03*S)col=vec3(.02,0.,.01)+vec3(1.,.05,.15)*.7*pow(fb(g*2.+T*.5),2.)*smoothstep(0.,.18,e);
 float fg=exp(-t*.09);
 col=col*fg+step(.9985,h(floor(bu*420.)))*vec3(.9)*(1.-fg);
 col+=vec3(1.,.3,.4)*.25*exp(-pow((r-pr*1.35)*14.,2.))*(1.+B);
 vec2 q=vec2(d.x,d.y*5.5);float rr=length(q);
 float ds=smoothstep(.75,.45,rr)*smoothstep(.3,.42,rr);
 float st=fb(vec2(atan(q.y,q.x)*3.+T*.8*(1.+S*2.),rr*14.));
 vec3 dc=mix(vec3(1.,.35,.05),vec3(1.,.05,.5),st)*(1.+clamp(q.x*2.5,-.6,.8))*ds*(.5+st*1.5)*(1.+B*.5);
 if(r<pr){
  float z=sqrt(1.-r*r/(pr*pr));vec3 nr=vec3(d/pr,z);float a=T*.35+D*.02,cs=cos(a),sn=sin(a);
  vec3 w=vec3(nr.x*cs+nr.z*sn,nr.y,-nr.x*sn+nr.z*cs);
  float lon=atan(w.z,w.x),lat=w.y;vec2 q2=vec2(lon*1.5,lat*3.);
  float wp=fb(q2*2.+T*.05),sp=sin(lon*5.+lat*8.+wp*6.)*.5+.5;
  float vein=pow(1.-abs(sp*2.-1.),10.);
  vec3 pc=mix(vec3(.08,0.,.03),vec3(.85,.015,.1),pow(sp,1.5))+vec3(1.,.35,.45)*vein*.6;
  float df=max(dot(nr,normalize(vec3(-.6,.4,.7))),0.);
  pc*=.12+df*1.3;pc+=vec3(1.,.15,.3)*pow(1.-z,2.5)*.9;
  pc+=vec3(1.,.7,.2)*step(.82,n(q2*30.))*(1.-df)*step(.45,wp)*1.4;
  col=pc;
 }else col+=vec3(1.,.1,.25)*exp(-(r-pr)*16.)*.7*(1.+B*.6);
 if(r>pr||d.y<0.)col+=dc;
 return col;
}
void main(){
 vec2 uv=(gl_FragCoord.xy-.5*R)/R.y;float a=(.004+.02*S)*(1.+B*1.5);
 vec3 c=vec3(scene(uv+vec2(a,0.)).r,scene(uv).g,scene(uv-vec2(a,0.)).b);
 c=1.-exp(-c*1.4);c*=smoothstep(1.3,.3,length(uv));c*=1.+B*.18;
 c+=(h(gl_FragCoord.xy+T)-.5)*.04;gl_FragColor=vec4(c,1.);
}`;
const cv=document.getElementById('c'),gl=cv.getContext('webgl',{antialias:false,powerPreference:'high-performance'});
const $=i=>document.getElementById(i);
if(!gl){document.body.insertAdjacentHTML('beforeend','<p style="position:fixed;inset:40% 0 0;text-align:center">webgl is required to enter.</p>')}
else{
const sh=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(o));return o};
const pg=gl.createProgram();
gl.attachShader(pg,sh(gl.VERTEX_SHADER,'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}'));
gl.attachShader(pg,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pg);gl.useProgram(pg);
const bf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,bf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const al=gl.getAttribLocation(pg,'a');gl.enableVertexAttribArray(al);gl.vertexAttribPointer(al,2,gl.FLOAT,false,0,0);
const U={};['R','M','T','D','B','S','P'].forEach(k=>U[k]=gl.getUniformLocation(pg,k));
let scale=Math.min(devicePixelRatio||1,1.5);
function size(){cv.width=Math.max(2,innerWidth*scale|0);cv.height=Math.max(2,innerHeight*scale|0);gl.viewport(0,0,cv.width,cv.height)}
addEventListener('resize',size);size();

// original footfall audio
let ac,mg,dr,nb;
function initAudio(){if(ac)return;try{
 ac=new(window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();mg.gain.value=.55;mg.connect(ac.destination);
 const o=ac.createOscillator(),o2=ac.createOscillator(),f=ac.createBiquadFilter(),g=ac.createGain();
 o.type=o2.type='sawtooth';o.frequency.value=43.65;o2.frequency.value=43.95;f.type='lowpass';f.frequency.value=220;g.gain.value=.13;
 o.connect(f);o2.connect(f);f.connect(g);g.connect(mg);o.start();o2.start();dr=f;
 nb=ac.createBuffer(1,ac.sampleRate*.1,ac.sampleRate);const dd=nb.getChannelData(0);for(let i=0;i<dd.length;i++)dd[i]=Math.random()*2-1;
}catch(e){}}
function kick(odd){if(!ac)return;const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
 o.frequency.setValueAtTime(170,t);o.frequency.exponentialRampToValueAtTime(42,t+.14);
 g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(g);g.connect(mg);o.start(t);o.stop(t+.32);
 if(odd){const s=ac.createBufferSource(),hp=ac.createBiquadFilter(),hg=ac.createGain();s.buffer=nb;hp.type='highpass';hp.frequency.value=7000;
  hg.gain.setValueAtTime(.16,t);hg.gain.exponentialRampToValueAtTime(.001,t+.06);s.connect(hp);hp.connect(hg);hg.connect(mg);s.start(t)}}

// the voice from the void (procedural)
const V=document.getElementById('voice');let vt=0,vq=0;
const A=['the earth is spinning under your feet','every ceiling tile remembers your footfall','the rose is not a flower, it is a clock','the singularity keeps your pace','your heart has been rented by the void','velocity is just patience with teeth','the lattice is infinite and so is your cadence','nothing here is load-bearing but you'];
const Bz=['keep going.','do not look up.','faster.','the petals are counting.','breathe in crimson.','this is the good pain.','the planet agrees.','shred.'];
function say(s){clearTimeout(vt);clearInterval(vq);V.style.opacity=1;V.textContent='';let i=0;
 vq=setInterval(()=>{V.textContent=s.slice(0,++i);if(i>=s.length){clearInterval(vq);vt=setTimeout(()=>V.style.opacity=0,4200)}},34)}
const rnd=a=>a[Math.random()*a.length|0];

// input & high-energy looping soundtrack hook
let held=0,mx=0,my=0,tx=0,ty=0;
const go=$('go');
const musicToggle=$('musicToggle');

function down(){
 initAudio();
 if(ac&&ac.state==='suspended')ac.resume();
 if(window.highEnergyMusic) window.highEnergyMusic.start();
 go.style.opacity=0;
 setTimeout(()=>go.style.display='none',800);
 if(!held)say('shred season.');
 held=1;
 if(window.highEnergyMusic) window.highEnergyMusic.setOverdrive(true);
}

function up(){
 held=0;
 if(window.highEnergyMusic) window.highEnergyMusic.setOverdrive(false);
}

musicToggle.addEventListener('click', (e) => {
 e.stopPropagation();
 if(!window.highEnergyMusic) return;
 const active = window.highEnergyMusic.toggle();
 musicToggle.textContent = active ? '🔊 MUSIC ON' : '🔇 MUSIC OFF';
});

addEventListener('pointerdown',down);addEventListener('pointerup',up);addEventListener('pointercancel',up);
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(!held)down()}});addEventListener('keyup',e=>{if(e.code==='Space')up()});
addEventListener('pointermove',e=>{tx=(e.clientX/innerWidth-.5)*2;ty=(.5-e.clientY/innerHeight)*2});

let last=performance.now(),T=0,D=0,S=0,Bt=0,ph=0,miles=0,lastMile=0,slow=0,nextV=7,hrv=148;
setTimeout(()=>say('five miles. '+rnd(A)+'.'),1200);
function frame(now){
 const dt=Math.min(.05,(now-last)/1e3);last=now;T+=dt;
 S+=(held-S)*Math.min(1,dt*(held?2.5:1.2));
 mx+=(tx-mx)*Math.min(1,dt*3);my+=(ty-my)*Math.min(1,dt*3);
 const bpm=172+S*20,pv=ph;ph+=bpm/60*dt;
 if(Math.floor(ph)!==Math.floor(pv)){Bt=1;kick(Math.floor(ph)&1)}
 Bt=Math.max(0,Bt-dt*4.5);
 D+=dt*(2.2+S*14);const spd=.0033+.008*S;miles+=dt*spd;
 if(dr)dr.frequency.value=220+S*1500+Bt*300;
 if(Math.floor(miles)>lastMile){lastMile=Math.floor(miles);say(lastMile>=5?'mile 5. you did not finish. the loop finished you.':'mile '+lastMile+'. '+rnd(Bz))}
 nextV-=dt;if(nextV<0){nextV=9+Math.random()*6;say(rnd(A)+'. '+rnd(Bz))}
 $('mi').textContent=miles.toFixed(2);$('sp').textContent=Math.round(bpm);
 hrv+=((142+S*46)-hrv)*dt;$('hr').textContent=Math.round(hrv+Bt*3);
 const sp=1/spd,m=sp/60|0,s=Math.round(sp%60);$('pc').textContent=m+':'+String(s===60?59:s).padStart(2,'0');
 $('pr').style.width=Math.min(100,miles/5*100)+'%';
 slow=slow*.95+dt*.05;if(slow>.024&&scale>.45){scale*=.85;slow=0;size()}
 gl.uniform2f(U.R,cv.width,cv.height);gl.uniform2f(U.M,mx,my);
 gl.uniform1f(U.T,T);gl.uniform1f(U.D,D);gl.uniform1f(U.B,Bt);gl.uniform1f(U.S,S);gl.uniform1f(U.P,ph);
 gl.drawArrays(gl.TRIANGLES,0,3);requestAnimationFrame(frame)}
requestAnimationFrame(frame);
}
</script>
</body>
</html>
